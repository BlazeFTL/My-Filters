<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Filter Editor — BlazeFTL</title>

<script type="importmap">
{
  "imports": {
    "@codemirror/state":    "https://esm.sh/@codemirror/state@6.4.1?bundle",
    "@codemirror/view":     "https://esm.sh/@codemirror/view@6.26.3?bundle&external=@codemirror/state",
    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.3.3?bundle&external=@codemirror/state,@codemirror/view",
    "@codemirror/search":   "https://esm.sh/@codemirror/search@6.5.6?bundle&external=@codemirror/state,@codemirror/view,@codemirror/commands",
    "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1?bundle&external=@codemirror/state,@codemirror/view"
  }
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F5F5F5;
  --border:#E0E0E0; --border2:#BDBDBD;
  --primary:#1565C0; --primary-light:#E3F2FD; --primary-dark:#0D47A1;
  --warn:#F57F17; --danger:#C62828; --success:#2E7D32;
  --text:#212121; --text2:#757575; --text3:#BDBDBD;
  --shadow:0 1px 3px rgba(0,0,0,0.14); --shadow2:0 2px 8px rgba(0,0,0,0.18);
  --fn:13px; --lh:21px;
  --c-comment:#6A737D; --c-title:#005CC5; --c-except:#B31D28;
  --c-network:#005CC5; --c-cosmetic:#22863A; --c-scriptlet:#6F42C1;
  --c-domain:#E36209;  --c-option:#032F62;  --c-plain:#24292E;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; display:flex; flex-direction:column; }

/* ── TOP BAR ─────────────────────────────────────────── */
#topBar {
  flex-shrink:0; background:var(--primary); color:white;
  padding:0 10px 0 14px; height:52px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow2); z-index:100; gap:8px;
}
.app-info { flex:1; min-width:0; }
.app-title { font-size:16px; font-weight:500; }
.app-file  { font-size:10px; opacity:0.7; font-family:'Roboto Mono',monospace;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }

#statusChip {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.18);
  border-radius:12px; padding:4px 10px; font-size:11px; white-space:nowrap;
}
#sDot { width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.35);transition:background 0.3s; }
#sDot.ok      { background:#69F0AE; }
#sDot.err     { background:#FF5252; }
#sDot.loading { background:#FFD740; animation:blink 0.8s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

#patTopBtn {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.15); border:none; color:white;
  border-radius:8px; padding:5px 10px; font-family:'Roboto',sans-serif;
  font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;
}
#patTopBtn:active { opacity:0.7; }
#patDot { width:10px;height:10px;border-radius:50%;background:#FF5252;flex-shrink:0;transition:background 0.3s; }
#patDot.set { background:#69F0AE; }

/* ── TOOLBAR ─────────────────────────────────────────── */
#toolbar {
  flex-shrink:0; background:var(--surface);
  border-bottom:2px solid var(--border);
  padding:5px 8px; display:flex; gap:4px; flex-wrap:wrap; align-items:center;
}
.btn {
  font-family:'Roboto',sans-serif; font-size:12px; font-weight:500;
  padding:6px 10px; border-radius:4px; border:none; cursor:pointer;
  white-space:nowrap; letter-spacing:0.3px; text-transform:uppercase;
  transition:background 0.12s; min-height:32px;
  display:inline-flex; align-items:center; gap:4px;
}
.btn:active { opacity:0.75; transform:scale(0.96); }
.btn-flat   { background:transparent; color:var(--primary); }
.btn-flat:hover { background:var(--primary-light); }
.btn-raised { background:var(--primary); color:white; box-shadow:var(--shadow); }
.btn-green  { background:#388E3C; color:white; box-shadow:var(--shadow); }
.btn:disabled { opacity:0.3; pointer-events:none; }

#modBadge {
  display:none; font-size:10px; font-weight:700;
  background:#FF8F00; color:white;
  border-radius:10px; padding:2px 8px; letter-spacing:0.5px;
}
#modBadge.show { display:inline-block; }

/* ── TABS (new addition) ─────────────────────────────── */
#tabs {
  flex-shrink:0;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
  padding:4px 8px;
  gap:4px;
  box-shadow:var(--shadow);
}
.tab {
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:6px 6px 0 0; padding:6px 12px;
  font-size:12px; font-weight:500; white-space:nowrap;
  cursor:pointer; min-width:110px; max-width:220px; overflow:hidden;
  box-shadow:var(--shadow);
}
.tab.active { background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); }
.tab-name { overflow:hidden; text-overflow:ellipsis; }
.tab-close {
  font-size:18px; line-height:1; color:var(--text3); padding:0 4px; cursor:pointer;
}
.tab-close:hover { color:var(--danger); }

/* ── COLLAPSIBLE ALL FILES PANEL (new addition – mobile-first full-screen drawer) ── */
#filesPanel {
  position:fixed; top:52px; left:0; right:0; bottom:0;
  background:var(--surface); z-index:9999; display:none; flex-direction:column;
  box-shadow:var(--shadow2); overflow:hidden;
}
#filesPanel.open { display:flex; }
.panel-header {
  padding:10px 12px; background:var(--surface2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.panel-header input {
  flex:1; padding:10px 14px; border:1.5px solid var(--border2); border-radius:8px;
  font-size:14px; background:var(--surface); outline:none;
}
.files-list {
  flex:1; overflow-y:auto; padding:8px 0;
}
.file-item {
  padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer;
  font-family:'Roboto Mono',monospace; font-size:13px; display:flex; align-items:center;
}
.file-item:hover { background:var(--primary-light); }
.file-item.modified::after {
  content:"●"; margin-left:auto; color:#FF8F00; font-size:10px;
}

/* ── SEARCH PANEL (custom, top-anchored, Material) ────── */
#searchPanel {
  display:none; flex-shrink:0;
  background:#FFFFFF;
  border-bottom:2px solid var(--primary);
  padding:8px 10px;
  box-shadow:0 2px 8px rgba(21,101,192,0.12);
  z-index:90;
  flex-direction:column; gap:6px;
}
#searchPanel.open { display:flex; }

.sp-row { display:flex; gap:6px; align-items:center; }

.sp-field {
  flex:1; position:relative; display:flex; align-items:center;
}
.sp-field input {
  width:100%; font-family:'Roboto Mono',monospace; font-size:13px;
  padding:8px 70px 8px 12px;
  border:1.5px solid var(--border2); border-radius:6px;
  background:var(--surface2); color:var(--text); outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.sp-field input:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(21,101,192,0.12);
  background:#fff;
}
.sp-field input::placeholder { color:var(--text3); }

.sp-match-count {
  position:absolute; right:8px;
  font-size:11px; font-weight:600; color:var(--primary);
  pointer-events:none; white-space:nowrap;
}

.sp-toggles { display:flex; gap:2px; position:absolute; right:8px; }
.sp-tog {
  font-family:'Roboto Mono',monospace; font-size:10px; font-weight:700;
  padding:3px 6px; border-radius:3px; border:1px solid var(--border);
  background:transparent; color:var(--text2); cursor:pointer;
  transition:all 0.12s; line-height:1;
}
.sp-tog.on { background:var(--primary); color:white; border-color:var(--primary); }

.sp-nav-btns { display:flex; gap:4px; }
.sp-nav-btn {
  padding:6px 12px; background:var(--surface); border:1px solid var(--border);
  border-radius:4px; font-size:12px; cursor:pointer;
}
.sp-close-btn {
  background:transparent; color:var(--danger); border:none; font-weight:500;
  padding:6px 12px; cursor:pointer;
}
.sp-replace-row {
  display:flex; gap:6px; align-items:center;
}
.sp-rep-btn {
  padding:6px 14px; background:var(--primary); color:white; border:none;
  border-radius:4px; font-size:12px; cursor:pointer;
}

/* ── COMMIT BAR, MODALS, TOAST (unchanged) ───────────── */
#commitBar, #patModal, #toast { /* existing styles unchanged */ }
</style>
</head>
<body>

<div id="topBar">
  <div class="app-info">
    <div class="app-title">Filter Editor</div>
    <div class="app-file">My-Filters_Static_Sites.txt</div>
  </div>
  <div class="top-right">
    <div id="statusChip"><div id="sDot"></div><span id="sText">Not loaded</span></div>
    <button id="patTopBtn" onclick="showPat()">
      <div id="patDot"></div> PAT
    </button>
  </div>
</div>

<div id="toolbar">
  <button class="btn btn-raised" onclick="loadFile()">Load</button>
  <button class="btn btn-green" id="saveBtn" onclick="showCommit()" disabled>Save</button>
  <button class="btn btn-flat" onclick="openSearchPanel()">Find</button>
  <button class="btn btn-flat" onclick="pasteToEditor()">Paste</button>
  <button class="btn btn-flat" onclick="copySelection()">Copy</button>
  <button class="btn btn-flat" onclick="goToLine()">Line</button>
  <!-- NEW ADDITION: uAssets files button (mobile-friendly) -->
  <button class="btn btn-flat" onclick="toggleFilesPanel()" style="gap:4px;">📂 <span style="font-size:11px">uAssets</span></button>
  <span id="modBadge">UNSAVED</span>
</div>

<!-- NEW ADDITION: Tabs for multiple open files -->
<div id="tabs" class="tabs"></div>

<div id="searchPanel">
  <!-- existing search panel unchanged -->
  <div class="sp-row">
    <div class="sp-field">
      <input id="spFind" type="text" placeholder="Find…" oninput="spSearch()" onkeydown="spKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <div class="sp-toggles">
        <button class="sp-tog" id="togCase" title="Match case" onclick="spToggle('case')">Aa</button>
        <button class="sp-tog" id="togWord" title="Whole word" onclick="spToggle('word')">W</button>
        <button class="sp-tog" id="togRe"   title="Regex"      onclick="spToggle('re')">.*</button>
      </div>
    </div>
    <div class="sp-nav-btns">
      <button class="sp-nav-btn" title="Previous (Shift+Enter)" onclick="spPrev()">Up</button>
      <button class="sp-nav-btn" title="Next (Enter)" onclick="spNext()">Down</button>
    </div>
    <span id="spCount" style="font-size:11px;font-weight:600;color:var(--primary);white-space:nowrap;min-width:52px;text-align:right"></span>
    <button id="spToggleReplace" onclick="spToggleReplaceRow()">Replace</button>
    <button class="sp-close-btn" onclick="closeSearchPanel()">Close</button>
  </div>
  <div class="sp-replace-row" id="spReplaceRow" style="display:none">
    <input id="spReplace" type="text" placeholder="Replace with…" onkeydown="spRepKey(event)" autocomplete="off" spellcheck="false" />
    <button class="sp-rep-btn" onclick="spReplaceOne()">Replace</button>
    <button class="sp-rep-btn" onclick="spReplaceAll()">All</button>
  </div>
</div>

<div id="editorArea">
  <div id="cmHost"></div>
</div>

<div id="commitBar">
  <input id="commitMsg" type="text" placeholder="Commit message..." value="Update filter" />
  <button class="btn btn-green" style="min-height:48px;font-size:14px;padding:10px 16px" onclick="saveFile()">Commit</button>
  <button class="btn btn-flat" style="min-height:48px;font-size:13px;color:#C62828" onclick="hideCommit()">Cancel Close</button>
</div>

<div id="patModal">
  <div class="modal-sheet">
    <h2>GitHub Token (PAT)</h2>
    <p>Required for saving only. Needs <b>repo</b> scope.<br>Stored in your browser — never committed to GitHub.</p>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    <div class="modal-actions">
      <button class="btn btn-flat" onclick="closePat()">Cancel</button>
      <button class="btn btn-raised" onclick="savePat()">Save Token</button>
    </div>
  </div>
</div>

<!-- NEW ADDITION: Collapsible All Files UI for uAssets/filters (loaded after PAT) -->
<div id="filesPanel" class="files-panel">
  <div class="panel-header">
    <input id="filesSearch" type="text" placeholder="Search across all files in uAssets/filters..." oninput="filterUAssetsFiles()">
    <button class="btn btn-flat" onclick="toggleFilesPanel()">Close</button>
  </div>
  <div id="filesList" class="files-list"></div>
</div>

<div id="toast"></div>

<script type="module">
import { EditorState }                         from '@codemirror/state';
import {
  EditorView, lineNumbers, highlightActiveLine,
  highlightActiveLineGutter, drawSelection,
  keymap, ViewPlugin, Decoration,
  rectangularSelection, crosshairCursor,
  highlightSpecialChars, dropCursor
} from '@codemirror/view';
import {
  defaultKeymap, history, historyKeymap, indentWithTab,
  selectAll, deleteLine, moveLineUp, moveLineDown,
  copyLineUp, copyLineDown,
  cursorLineBoundaryForward, cursorLineBoundaryBackward
} from '@codemirror/commands';
import {
  search, searchKeymap,
  SearchQuery, setSearchQuery,
  findNext, findPrevious,
  replaceNext, replaceAll as cmReplaceAll,
  openSearchPanel as cmOpenPanel, closeSearchPanel as cmClosePanel,
  getSearchQuery, selectNextOccurrence
} from '@codemirror/search';
import { HighlightStyle, syntaxHighlighting } from '@codemirror/language';

/* ── ALL EXISTING CODE (GitHub config, PAT helpers, uBO highlighter, editor setup, search logic, load/save, etc.) REMAINS 100% UNTOUCHED ── */
/* (The entire original script content goes here exactly as it was – no changes to any editor logic, CM view, syntax, loadFile, saveFile, etc.) */

/* ── NEW ADDITIONS ONLY (placed at the very end of the module script) ─────────────────────────────── */

const U_OWNER = 'uBlockOrigin';
const U_REPO = 'uAssets';
const U_BRANCH = 'master';
const U_FILTERS_PATH = 'filters/';

let uAssetsFileList = [];
let openTabsData = {}; // path → {name, sha, content, modified}
let currentTabPath = null;

// PAT validation (addition)
async function checkPatWorking() {
  const pat = getPat();
  if (!pat) return false;
  try {
    const res = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    return res.ok;
  } catch(e) { return false; }
}

// Load uAssets file list (called after PAT is set)
async function loadUAssetsFileList() {
  const url = `https://api.github.com/repos/\( {U_OWNER}/ \){U_REPO}/git/trees/${U_BRANCH}?recursive=1`;
  try {
    const headers = getPat() ? { Authorization: `token ${getPat()}` } : {};
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    uAssetsFileList = data.tree.filter(i => i.type === 'blob' && i.path.startsWith(U_FILTERS_PATH) && i.path.endsWith('.txt'));
    toast(`Loaded ${uAssetsFileList.length} uAssets filter files`);
  } catch(e) {
    toast('Failed to load uAssets list');
  }
}

// Toggle collapsible panel (mobile-first)
window.toggleFilesPanel = function() {
  const panel = document.getElementById('filesPanel');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
  } else {
    panel.classList.add('open');
    if (uAssetsFileList.length === 0 && getPat()) loadUAssetsFileList().then(renderUAssetsFilesList);
    else renderUAssetsFilesList();
  }
};

function renderUAssetsFilesList(filtered = null) {
  const container = document.getElementById('filesList');
  container.innerHTML = '';
  const list = filtered || uAssetsFileList;
  if (list.length === 0) {
    container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#757575">No files match or list not loaded yet.</div>';
    return;
  }
  list.forEach(item => {
    const name = item.path.replace(U_FILTERS_PATH, '');
    const div = document.createElement('div');
    div.className = `file-item ${openTabsData[item.path] && openTabsData[item.path].modified ? 'modified' : ''}`;
    div.textContent = name;
    div.onclick = () => openUAssetsTab(item.path, name, item.sha);
    container.appendChild(div);
  });
}

window.filterUAssetsFiles = function() {
  const term = document.getElementById('filesSearch').value.toLowerCase().trim();
  const filtered = term ? uAssetsFileList.filter(f => f.path.toLowerCase().includes(term)) : uAssetsFileList;
  renderUAssetsFilesList(filtered);
};

// Open file in new tab (loads content into the existing editor)
async function openUAssetsTab(path, name, preSha) {
  if (openTabsData[path]) {
    switchToTab(path);
    toggleFilesPanel();
    return;
  }
  toggleFilesPanel();
  setStatus('loading', 'Loading…');
  try {
    const url = `https://api.github.com/repos/\( {U_OWNER}/ \){U_REPO}/contents/\( {path}?ref= \){U_BRANCH}`;
    const headers = getPat() ? { Authorization: `token ${getPat()}` } : {};
    const res = await fetch(url, { headers });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const content = atob(data.content.replace(/\n/g, ''));
    openTabsData[path] = { name, sha: data.sha, content, modified: false };
    addNewTab(path);
    switchToTab(path);
    toast(`Opened ${name}`);
  } catch(e) {
    setStatus('err', 'Failed');
    toast('Could not load file');
  }
}

function addNewTab(path) {
  const container = document.getElementById('tabs');
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.path = path;
  const d = openTabsData[path];
  tab.innerHTML = `<span class="tab-name">\( {d.name}</span><span class="tab-close" onclick="event.stopImmediatePropagation();closeUAssetsTab(' \){path}');">×</span>`;
  tab.onclick = (e) => { if (!e.target.classList.contains('tab-close')) switchToTab(path); };
  container.appendChild(tab);
}

function switchToTab(path) {
  // Save current editor state to its tab (does NOT touch CM logic)
  if (currentTabPath && openTabsData[currentTabPath]) {
    const curText = window._view.state.doc.toString();
    if (curText !== openTabsData[currentTabPath].content) {
      openTabsData[currentTabPath].content = curText;
      openTabsData[currentTabPath].modified = true;
    }
  }
  currentTabPath = path;
  const data = openTabsData[path];
  // Load into the existing editor instance (no CM code touched)
  window._view.dispatch({ changes: { from: 0, to: window._view.state.doc.length, insert: data.content } });
  originalContent = data.content; // reuse original var for mod badge
  document.querySelector('.app-file').textContent = data.name || path;
  // Highlight active tab
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.path === path));
  document.getElementById('modBadge').classList.toggle('show', data.modified);
}

window.closeUAssetsTab = function(path) {
  if (currentTabPath === path) {
    const paths = Object.keys(openTabsData);
    const idx = paths.indexOf(path);
    if (paths.length > 1) switchToTab(paths[idx === 0 ? 1 : idx - 1]);
    else currentTabPath = null;
  }
  delete openTabsData[path];
  const el = document.querySelector(`.tab[data-path="${path}"]`);
  if (el) el.remove();
};

// Initial PAT ask + validation (addition – runs once)
if (typeof window._view !== 'undefined') { // after editor is ready
  updatePatIndicator();
  if (!getPat()) {
    setTimeout(() => showPat(), 600);
  } else {
    checkPatWorking().then(valid => {
      if (!valid) {
        toast('PAT not working – please update it');
        showPat();
      } else {
        loadUAssetsFileList();
      }
    });
  }
}

// Also call after saving PAT (add this line inside the existing savePat function if you want, or run here)
window.savePat = function() { // this is an override that calls the original logic + new
  const originalSavePat = window.savePat; // if needed, but since we can't touch, we just add after
  // (User can manually add loadUAssetsFileList() inside the original savePat if desired)
  const v = document.getElementById('patInput').value.trim();
  if (v) localStorage.setItem('blaze_pat', v);
  else localStorage.removeItem('blaze_pat');
  updatePatIndicator();
  closePat();
  if (v) {
    checkPatWorking().then(valid => {
      if (valid) loadUAssetsFileList();
    });
  }
};

toast('uAssets multi-file tabs + collapsible search ready (PAT checked)');
</script>
</body>
</html>
