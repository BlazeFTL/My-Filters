<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBO Filter Manager | BlazeFTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f9fafb; color: #111827; }
        .wiki-card { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .code-font { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
        #fileInput { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b pb-6">
            <div class="flex items-center gap-3 mb-2">
                <i class="fa-solid fa-file-shield text-3xl text-blue-600"></i>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">uBO Filter Checker</h1>
            </div>
            <p class="text-gray-500">Upload or paste filters to detect dead domains with single-domain preservation logic.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-lg shadow-sm border p-6">
                    <div class="flex flex-wrap gap-3 mb-4">
                        <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-black transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-file-arrow-up"></i> Upload .txt
                        </button>
                        <input type="file" id="fileInput" accept=".txt" onchange="handleFile(this)">
                        
                        <button onclick="handlePaste()" class="flex-1 border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-50 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-clipboard"></i> Paste
                        </button>
                    </div>

                    <textarea id="filterInput" rows="12" 
                        class="w-full p-4 border rounded-md bg-gray-50 code-font text-xs focus:ring-2 focus:ring-blue-500 outline-none mb-4"
                        placeholder="Paste uBlock filters or GitHub links..."></textarea>

                    <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-blue-50 p-4 rounded-md border border-blue-100">
                        <span class="text-sm text-blue-800 font-medium">
                            <i class="fa-solid fa-circle-info mr-1"></i> 
                            Single-domain dead filters will be commented with <code>! dead</code>
                        </span>
                        <button id="runBtn" onclick="processFilters()" class="w-full sm:w-auto bg-blue-600 text-white px-8 py-2 rounded-md font-bold hover:bg-blue-700 transition">
                            RUN ANALYSIS
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div id="statusBox" class="hidden bg-gray-900 rounded-lg p-5 shadow-inner">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold text-blue-400">PROCESSING LOG</span>
                        <div id="loadingSpinner" class="loader w-3 h-3 border-2 border-gray-600 rounded-full"></div>
                    </div>
                    <div id="logArea" class="h-48 overflow-y-auto text-[10px] code-font text-gray-400 space-y-1"></div>
                </div>

                <div class="wiki-card bg-[#fffcf0] rounded-lg p-5 border-l-4 border-amber-400">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-amber-800 font-bold text-sm uppercase">Processed Results</h3>
                        <button id="dlBtn" onclick="downloadResults()" class="hidden text-xs bg-amber-200 hover:bg-amber-300 px-3 py-1 rounded font-bold text-amber-900">
                            <i class="fa-solid fa-download mr-1"></i> DOWNLOAD .TXT
                        </button>
                    </div>
                    <textarea id="filterOutput" readonly class="w-full bg-transparent border-none resize-none code-font text-[11px] text-amber-900 focus:ring-0" rows="12" placeholder="Results will appear here..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let domainCache = new Map();

        async function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const text = await file.text();
            document.getElementById('filterInput').value = text;
        }

        async function handlePaste() {
            const text = await navigator.clipboard.readText();
            document.getElementById('filterInput').value = text;
        }

        function extractDomains(line) {
            if (!line.trim() || line.startsWith('!') || line.startsWith('[')) return null;
            let domainPart = line.split(/##|\$|#@#/)[0]
                                .replace(/^\|\|/, '')
                                .replace(/^@@/, '')
                                .trim();
            
            if (!domainPart) return null;
            return domainPart.split(',').map(d => d.trim().replace(/^https?:\/\//, '').split('/')[0].split(':')[0]);
        }

        async function isDomainDead(domain) {
            if (domain.includes('*')) return false;
            if (domainCache.has(domain)) return domainCache.get(domain);

            try {
                const dns = await fetch(`https://dns.google/resolve?name=${domain}&type=A`).then(r => r.json());
                if (dns.Status !== 0 || !dns.Answer) {
                    domainCache.set(domain, true);
                    return true;
                }
                // Quick HTTP ping
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 3000);
                try {
                    await fetch(`https://${domain}`, { mode: 'no-cors', signal: ctrl.signal });
                    clearTimeout(tid);
                    domainCache.set(domain, false);
                    return false;
                } catch {
                    domainCache.set(domain, true);
                    return true;
                }
            } catch { return false; }
        }

        async function processFilters() {
            const input = document.getElementById('filterInput').value;
            if (!input) return;

            const runBtn = document.getElementById('runBtn');
            const logArea = document.getElementById('logArea');
            const output = document.getElementById('filterOutput');
            const statusBox = document.getElementById('statusBox');

            runBtn.disabled = true;
            statusBox.classList.remove('hidden');
            logArea.innerHTML = `> Initializing...<br>`;
            
            const lines = input.split('\n');
            let results = [];

            for (let line of lines) {
                const domains = extractDomains(line);

                if (!domains) {
                    results.push(line);
                    continue;
                }

                // Logic: Only comment if exactly 1 domain and it is dead
                if (domains.length === 1) {
                    const dead = await isDomainDead(domains[0]);
                    if (dead) {
                        logArea.innerHTML += `<span class="text-red-400">DEAD: ${domains[0]}</span><br>`;
                        results.push(`! dead\n! ${line}`);
                    } else {
                        results.push(line);
                    }
                } else {
                    // Multiple domains: we verify the first one just to check status, 
                    // but we keep the line active regardless to avoid breaking the filter for other sites
                    results.push(line);
                }
                logArea.scrollTop = logArea.scrollHeight;
            }

            output.value = results.join('\n');
            document.getElementById('dlBtn').classList.remove('hidden');
            document.getElementById('loadingSpinner').classList.add('hidden');
            runBtn.disabled = false;
            logArea.innerHTML += `> Done. Check results.`;
        }

        function downloadResults() {
            const content = document.getElementById('filterOutput').value;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `processed_filters_${new Date().getTime()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
