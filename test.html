<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Manager | BlazeFTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f9fafb; }
        .wiki-card { border: 1px solid #e5e7eb; transition: 0.2s; }
        .code-font { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .badge-dead { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .badge-live { background: #dcfce7; color: #22c55e; border: 1px solid #bbf7d0; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-microchip text-blue-600"></i> Domain & Filter Engine
            </h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 space-y-4">
                <div class="bg-white p-5 rounded-lg border shadow-sm">
                    <div class="flex gap-2 mb-4">
                        <button onclick="document.getElementById('fUp').click()" class="flex-1 bg-gray-800 text-white py-2 rounded font-bold text-sm hover:bg-black">UPLOAD .TXT</button>
                        <input type="file" id="fUp" class="hidden" onchange="handleFile(this)">
                        <button onclick="handlePaste()" class="flex-1 border py-2 rounded font-bold text-sm hover:bg-gray-50">PASTE</button>
                    </div>
                    <textarea id="ti" rows="8" class="w-full p-3 border rounded bg-gray-50 code-font text-xs mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste domains or filters..."></textarea>
                    <button id="rb" onclick="run()" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700 shadow-lg shadow-blue-100">RUN DEEP ANALYSIS</button>
                </div>

                <div id="vsBox" class="hidden bg-white p-5 rounded-lg border shadow-sm">
                    <h3 class="text-xs font-bold text-gray-400 uppercase mb-3">Live Verification</h3>
                    <div id="sg" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto"></div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
                <div class="wiki-card bg-[#f0f9ff] p-4 rounded-lg border-l-4 border-blue-400">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-blue-800 font-bold text-xs uppercase">Clean Comma</span>
                        <button onclick="copy('oc')" class="text-[10px] font-bold text-blue-600">COPY</button>
                    </div>
                    <textarea id="oc" readonly class="w-full bg-transparent border-none text-[11px] code-font text-blue-900 outline-none" rows="2"></textarea>
                </div>

                <div class="wiki-card bg-[#fdf2f8] p-4 rounded-lg border-l-4 border-pink-400">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-pink-800 font-bold text-xs uppercase">Clean Pipe</span>
                        <button onclick="copy('op')" class="text-[10px] font-bold text-pink-600">COPY</button>
                    </div>
                    <textarea id="op" readonly class="w-full bg-transparent border-none text-[11px] code-font text-pink-900 outline-none" rows="2"></textarea>
                </div>

                <div class="wiki-card bg-[#fffcf0] p-4 rounded-lg border-l-4 border-amber-400">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-amber-800 font-bold text-xs uppercase">Processed Filter</span>
                        <button onclick="dl()" class="text-[10px] font-bold text-amber-600">DOWNLOAD .TXT</button>
                    </div>
                    <textarea id="of" readonly class="w-full bg-transparent border-none text-[11px] code-font text-amber-900 outline-none" rows="8"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cache = new Map();

        async function handleFile(i) { if(i.files[0]) document.getElementById('ti').value = await i.files[0].text(); }
        async function handlePaste() { document.getElementById('ti').value = await navigator.clipboard.readText(); }
        function copy(id) { document.getElementById(id).select(); document.execCommand('copy'); }

        function getDomains(line) {
            if (!line.trim() || line.startsWith('!') || line.startsWith('[')) return null;
            let dPart = line.split(/##|\$|#@#/)[0].replace(/^\|\|/, '').replace(/^@@/, '').trim();
            return dPart ? dPart.split(',').map(d => d.trim().replace(/^https?:\/\//, '').split('/')[0].split(':')[0]) : null;
        }

        async function check(d) {
            if (cache.has(d)) return cache.get(d);
            try {
                // Primary check via DNS (Bypasses CORS issues)
                const res = await fetch(`https://dns.google/resolve?name=${d}&type=A`).then(r => r.json());
                const isDead = (res.Status !== 0 || !res.Answer);
                cache.set(d, isDead ? 'dead' : 'live');
                return isDead ? 'dead' : 'live';
            } catch { return 'dead'; }
        }

        function addBadge(d, s) {
            const item = document.createElement('div');
            item.className = "flex items-center gap-2 text-[10px] border-b pb-1";
            item.innerHTML = `<span class="badge ${s==='live'?'badge-live':'badge-dead'}">${s==='live'?'LIVE':'DEAD'}</span> <span class="truncate">${d}</span>`;
            document.getElementById('sg').prepend(item);
        }

        async function run() {
            const input = document.getElementById('ti').value;
            if (!input) return;
            
            document.getElementById('rb').disabled = true;
            document.getElementById('vsBox').classList.remove('hidden');
            document.getElementById('sg').innerHTML = '';
            
            let lines = input.split('\n'), cleanList = [], finalFilter = [];

            for (let line of lines) {
                const domains = getDomains(line);
                if (!domains) { finalFilter.push(line); continue; }

                let lineResults = [];
                for (let d of domains) {
                    const status = await check(d);
                    addBadge(d, status);
                    lineResults.push({ d, status });
                    if (status === 'live') cleanList.push(d);
                }

                // If any domain in the line is alive, keep the filter active
                // If the entire line is dead, comment it out
                const allDead = lineResults.every(r => r.status === 'dead');
                if (allDead) {
                    finalFilter.push(`! dead\n! ${line}`);
                } else {
                    finalFilter.push(line);
                }
            }

            const uniqueClean = [...new Set(cleanList)];
            document.getElementById('oc').value = uniqueClean.join(',');
            document.getElementById('op').value = uniqueClean.join('|');
            document.getElementById('of').value = finalFilter.join('\n');
            document.getElementById('rb').disabled = false;
        }

        function dl() {
            const b = new Blob([document.getElementById('of').value], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `blazeftl_clean_${Date.now()}.txt`;
            a.click();
        }
    </script>
</body>
</html>
