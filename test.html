<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBO Filter Manager | BlazeFTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f9fafb; color: #111827; }
        .wiki-card { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .code-font { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .status-log { scroll-behavior: smooth; }
        .status-log::-webkit-scrollbar { width: 6px; }
        .status-log::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; margin-right: 5px; }
        .badge-dead { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .badge-live { background: #dcfce7; color: #22c55e; border: 1px solid #bbf7d0; }
        .badge-skip { background: #fef9c3; color: #a16207; border: 1px solid #fef08a; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-6 border-b pb-6">
            <div class="flex items-center gap-3 mb-2">
                <i class="fa-solid fa-shield-virus text-3xl text-blue-600"></i>
                <h1 class="text-3xl font-bold tracking-tight">uBO Filter Analyzer</h1>
            </div>
            <p class="text-gray-500">Quad-layer verification with visual status badges and file preservation.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-lg shadow-sm border p-5">
                    <div class="flex gap-2 mb-4">
                        <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-gray-800 text-white py-2 rounded hover:bg-black transition text-sm font-bold">
                            <i class="fa-solid fa-file-upload"></i> UPLOAD .TXT
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept=".txt" onchange="handleFile(this)">
                        <button onclick="handlePaste()" class="flex-1 border py-2 rounded hover:bg-gray-50 transition text-sm font-bold">
                            <i class="fa-solid fa-paste"></i> PASTE
                        </button>
                    </div>

                    <textarea id="filterInput" rows="10" 
                        class="w-full p-4 border rounded bg-gray-50 code-font text-xs focus:ring-2 focus:ring-blue-500 outline-none mb-4"
                        placeholder="Paste domains or uBO filters..."></textarea>

                    <button id="runBtn" onclick="processFilters()" class="w-full bg-blue-600 text-white py-3 rounded-md font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        RUN DEEP ANALYSIS
                    </button>
                </div>

                <div id="visualStatus" class="hidden bg-white rounded-lg border p-5 shadow-sm">
                    <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-widest">Live Verification Status</h3>
                    <div id="statusGrid" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-2">
                        </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-gray-900 rounded-lg p-4 shadow-xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-blue-400">ENGINE LOG</span>
                        <div id="loader" class="hidden loader w-3 h-3 border-2 border-gray-600 rounded-full"></div>
                    </div>
                    <div id="logArea" class="h-40 overflow-y-auto text-[10px] code-font text-gray-400 space-y-1"></div>
                </div>

                <div class="wiki-card bg-[#fffcf0] rounded-lg p-5 border-l-4 border-amber-400 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-amber-800 font-bold text-sm">PROCESSED FILE</h3>
                        <button id="dlBtn" onclick="downloadResults()" class="hidden text-[10px] bg-amber-600 text-white px-2 py-1 rounded font-bold">
                            DOWNLOAD .TXT
                        </button>
                    </div>
                    <textarea id="filterOutput" readonly class="w-full bg-transparent border-none resize-none code-font text-[10px] text-amber-900 focus:ring-0" rows="12"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let domainCache = new Map();

        async function handleFile(input) {
            const file = input.files[0];
            if (file) document.getElementById('filterInput').value = await file.text();
        }

        async function handlePaste() {
            document.getElementById('filterInput').value = await navigator.clipboard.readText();
        }

        function extractDomains(line) {
            if (!line.trim() || line.startsWith('!') || line.startsWith('[')) return null;
            let dp = line.split(/##|\$|#@#/)[0].replace(/^\|\|/, '').replace(/^@@/, '').trim();
            if (!dp) return null;
            return dp.split(',').map(d => d.trim().replace(/^https?:\/\//, '').split('/')[0].split(':')[0]);
        }

        async function checkDomain(domain) {
            if (domain.includes('*')) return 'skip';
            if (domainCache.has(domain)) return domainCache.get(domain);

            try {
                const dns = await fetch(`https://dns.google/resolve?name=${domain}&type=A`).then(r => r.json());
                if (dns.Status !== 0 || !dns.Answer) {
                    domainCache.set(domain, 'dead');
                    return 'dead';
                }
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 3000);
                try {
                    await fetch(`https://${domain}`, { mode: 'no-cors', signal: ctrl.signal });
                    clearTimeout(tid);
                    domainCache.set(domain, 'live');
                    return 'live';
                } catch {
                    domainCache.set(domain, 'dead');
                    return 'dead';
                }
            } catch { return 'dead'; }
        }

        function addBadge(domain, status) {
            const grid = document.getElementById('statusGrid');
            const item = document.createElement('div');
            item.className = "flex items-center text-[11px] border-b border-gray-50 pb-1";
            const badgeClass = status === 'live' ? 'badge-live' : (status === 'dead' ? 'badge-dead' : 'badge-skip');
            const icon = status === 'live' ? '✅' : (status === 'dead' ? '❌' : '⏭');
            item.innerHTML = `<span class="badge ${badgeClass}">${icon} ${status.toUpperCase()}</span> <span class="truncate">${domain}</span>`;
            grid.prepend(item);
        }

        async function processFilters() {
            const input = document.getElementById('filterInput').value;
            if (!input) return;

            const runBtn = document.getElementById('runBtn');
            const logArea = document.getElementById('logArea');
            const output = document.getElementById('filterOutput');
            const visualStatus = document.getElementById('visualStatus');
            const statusGrid = document.getElementById('statusGrid');

            runBtn.disabled = true;
            visualStatus.classList.remove('hidden');
            document.getElementById('loader').classList.remove('hidden');
            logArea.innerHTML = `> Starting Quad-Layer Check...<br>`;
            statusGrid.innerHTML = '';
            
            const lines = input.split('\n');
            let finalResults = [];

            for (let line of lines) {
                const domains = extractDomains(line);
                if (!domains) {
                    finalResults.push(line);
                    continue;
                }

                let allDead = true;
                for (let d of domains) {
                    const status = await checkDomain(d);
                    addBadge(d, status);
                    if (status !== 'dead') allDead = false;
                }

                if (allDead) {
                    logArea.innerHTML += `<span class="text-red-400">!! DEAD: ${domains.join(', ')}</span><br>`;
                    finalResults.push(`! dead\n! ${line}`);
                } else {
                    finalResults.push(line);
                }
                logArea.scrollTop = logArea.scrollHeight;
            }

            output.value = finalResults.join('\n');
            document.getElementById('dlBtn').classList.remove('hidden');
            document.getElementById('loader').classList.add('hidden');
            runBtn.disabled = false;
        }

        function downloadResults() {
            const blob = new Blob([document.getElementById('filterOutput').value], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `blazeftl_verified_${Date.now()}.txt`;
            a.click();
        }
    </script>
</body>
</html>
