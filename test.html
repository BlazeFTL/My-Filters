<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitSync | Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #ffffff; color: #1f2328; }
        .wiki-header { border-bottom: 1px solid #d0d7de; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .btn-git { background-color: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 5px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-git:hover { background-color: #f3f4f6; }
        .btn-primary { background-color: #1f883d; color: white; border: 1px solid rgba(31,35,40,0.15); border-radius: 6px; padding: 6px 16px; font-weight: 600; }
        .btn-primary:hover { background-color: #1a7f37; }
        .code-area { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 12px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; }
        .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
        .badge-dead { background: #ffebe9; color: #cf222e; }
        .badge-live { background: #dafbe1; color: #1a7f37; }
        .result-card { border-radius: 6px; border-left: 4px solid; padding: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>

    

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold mb-1">Domain Verification Engine</h2>
            <p class="text-sm text-gray-500">Quad-Layer check: DNS, Wildcard Redirection, and Protocol Fetch.</p>
        </div>

        <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="document.getElementById('fUp').click()" class="btn-git">Upload .txt</button>
            <input type="file" id="fUp" class="hidden" onchange="handleFile(this)">
            <button onclick="handlePaste()" class="btn-git">Paste</button>
            <button onclick="runEngine()" id="runBtn" class="btn-primary ml-auto">Analyze</button>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Filter / Domain Input</label>
                <textarea id="ti" class="w-full h-48 p-4 code-area outline-none focus:ring-2 focus:ring-green-500" placeholder="Paste domains or filters..."></textarea>
            </div>

            <div id="logBox" class="hidden border rounded-md p-4 bg-white">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-3">Live Engine Logs</h3>
                <div id="sg" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
            </div>

            <div id="resultsContainer" class="hidden">
                <div class="result-card bg-[#f0f9ff] border-blue-500">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-blue-800 uppercase">Live Domains (Comma)</span>
                        <button onclick="copy('oc')" class="text-[10px] font-bold text-blue-600 uppercase">Copy</button>
                    </div>
                    <textarea id="oc" readonly class="w-full bg-transparent border-none text-xs code-area resize-none" rows="2"></textarea>
                </div>

                <div class="result-card bg-[#fff0f6] border-pink-500">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-pink-800 uppercase">Live Domains (Pipe)</span>
                        <button onclick="copy('op')" class="text-[10px] font-bold text-pink-600 uppercase">Copy</button>
                    </div>
                    <textarea id="op" readonly class="w-full bg-transparent border-none text-xs code-area resize-none" rows="2"></textarea>
                </div>

                <div id="filterSection" class="result-card bg-[#fffcf0] border-amber-500 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-amber-800 uppercase">Processed uBO Filter</span>
                        <button onclick="dl()" class="text-[10px] font-bold bg-amber-600 text-white px-2 py-0.5 rounded">Download</button>
                    </div>
                    <textarea id="of" readonly class="w-full bg-transparent border-none text-[11px] code-area resize-none" rows="8"></textarea>
                </div>
            </div>
        </div>
    </main>

    <script>
        let cache = new Map();

        async function handleFile(i) { if(i.files[0]) document.getElementById('ti').value = await i.files[0].text(); }
        async function handlePaste() { document.getElementById('ti').value = await navigator.clipboard.readText(); }
        function copy(id) { document.getElementById(id).select(); document.execCommand('copy'); }

        async function validate(d) {
            if (d.includes('*')) return 'skip';
            if (cache.has(d)) return cache.get(d);
            try {
                const dns = await fetch(`https://dns.google/resolve?name=${d}&type=A`).then(r => r.json());
                if (dns.Status !== 0 || !dns.Answer) return 'dead';
                const fake = `check-${Math.floor(Math.random()*999)}.${d}`;
                const wild = await fetch(`https://dns.google/resolve?name=${fake}&type=A`).then(r => r.json());
                if (wild.Status === 0 && wild.Answer) return 'dead';
                const c = new AbortController();
                const t = setTimeout(() => c.abort(), 4000);
                try {
                    await fetch(`https://${d}`, { mode: 'no-cors', signal: c.signal });
                    clearTimeout(t); return 'live';
                } catch {
                    try {
                        await fetch(`http://${d}`, { mode: 'no-cors', signal: c.signal });
                        clearTimeout(t); return 'live';
                    } catch { return 'dead'; }
                }
            } catch { return 'dead'; }
        }

        async function runEngine() {
            const input = document.getElementById('ti').value.trim();
            if (!input) return;

            document.getElementById('runBtn').disabled = true;
            document.getElementById('logBox').classList.remove('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            document.getElementById('sg').innerHTML = '';
            
            const lines = input.split('\n');
            let isUbo = input.includes('||') || input.includes('##') || input.includes('@@');
            let livePool = [], processedLines = [];

            for (let line of lines) {
                let domains = line.trim().startsWith('!') ? null : 
                              line.split(/##|\$|#@#/)[0].replace(/^\|\|/, '').replace(/^@@/, '').trim().split(',').map(d => d.trim());

                if (!domains || domains[0] === "") {
                    processedLines.push(line);
                    continue;
                }

                let results = [];
                for (let d of domains) {
                    const cleanD = d.replace(/^https?:\/\//, '').split('/')[0].split(':')[0];
                    const s = await validate(cleanD);
                    const el = document.createElement('div');
                    el.className = "flex items-center gap-2 text-[11px]";
                    el.innerHTML = `<span class="badge ${s==='live'?'badge-live':'badge-dead'}">${s}</span> <span>${cleanD}</span>`;
                    document.getElementById('sg').prepend(el);
                    
                    results.push(s);
                    if (s === 'live' || s === 'skip') livePool.push(cleanD);
                }

                if (results.every(s => s === 'dead')) {
                    processedLines.push(`! dead\n! ${line}`);
                } else {
                    processedLines.push(line);
                }
            }

            const unique = [...new Set(livePool)];
            document.getElementById('oc').value = unique.join(',');
            document.getElementById('op').value = unique.join('|');
            
            const filterSec = document.getElementById('filterSection');
            if (isUbo) {
                filterSec.classList.remove('hidden');
                document.getElementById('of').value = processedLines.join('\n');
            } else {
                filterSec.classList.add('hidden');
            }

            document.getElementById('runBtn').disabled = false;
        }

        function dl() {
            const b = new Blob([document.getElementById('of').value], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `cleansed_filters.txt`;
            a.click();
        }
    </script>
</body>
</html>
