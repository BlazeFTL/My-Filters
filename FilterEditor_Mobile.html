<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Filter Editor — BlazeFTL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F5F5F5;
  --border:#E0E0E0; --border2:#BDBDBD;
  --primary:#1565C0; --primary-light:#E3F2FD;
  --text:#212121; --text2:#757575; --text3:#BDBDBD;
  --shadow:0 1px 3px rgba(0,0,0,0.14); --shadow2:0 2px 8px rgba(0,0,0,0.18);
  --fn:13px; --lh:21px;
  --c-plain:#24292E;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Roboto',sans-serif;
  display:flex; flex-direction:column;
}

/* TOP BAR */
#topBar {
  flex-shrink:0; background:var(--primary); color:white;
  padding:0 10px 0 14px; height:52px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow2); z-index:100; gap:8px;
}
.app-info { flex:1; min-width:0; }
.app-title { font-size:16px; font-weight:500; }
.app-file  { font-size:10px; opacity:0.7; font-family:'Roboto Mono',monospace;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }

#statusChip {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.18);
  border-radius:12px; padding:4px 10px; font-size:11px; white-space:nowrap;
}
#sDot { width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.35);transition:background 0.3s; }
#sDot.ok      { background:#69F0AE; }
#sDot.err     { background:#FF5252; }
#sDot.loading { background:#FFD740; animation:blink 0.8s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

#patTopBtn {
  display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,0.15); border:none; color:white;
  border-radius:8px; padding:5px 10px; font-family:'Roboto',sans-serif;
  font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;
}
#patTopBtn:active { opacity:0.7; }
#patDot { width:10px;height:10px;border-radius:50%;background:#FF5252;flex-shrink:0;transition:background 0.3s; }
#patDot.set { background:#69F0AE; }

/* TOOLBAR */
#toolbar {
  flex-shrink:0; background:var(--surface);
  border-bottom:2px solid var(--border);
  padding:5px 8px; display:flex; gap:4px; flex-wrap:wrap; align-items:center;
}
.btn {
  font-family:'Roboto',sans-serif; font-size:12px; font-weight:500;
  padding:6px 10px; border-radius:4px; border:none; cursor:pointer;
  white-space:nowrap; letter-spacing:0.3px; text-transform:uppercase;
  transition:background 0.12s; min-height:32px;
  display:inline-flex; align-items:center; gap:4px;
}
.btn:active { opacity:0.75; transform:scale(0.96); }
.btn-flat   { background:transparent; color:var(--primary); }
.btn-flat:hover { background:var(--primary-light); }
.btn-raised { background:var(--primary); color:white; box-shadow:var(--shadow); }
.btn-green  { background:#388E3C; color:white; box-shadow:var(--shadow); }
.btn:disabled { opacity:0.3; pointer-events:none; }

#modBadge {
  display:none; font-size:10px; font-weight:700;
  background:#FF8F00; color:white;
  border-radius:10px; padding:2px 8px; letter-spacing:0.5px;
}
#modBadge.show { display:inline-block; }

/* FIND BAR */
#findBar {
  flex-shrink:0; background:#EFF6FF; border-bottom:1px solid #BBDEFB;
  padding:6px 8px; display:none; flex-direction:column; gap:5px;
}
#findBar.show { display:flex; }
.find-row { display:flex; gap:5px; align-items:center; }
.find-input {
  flex:1; min-width:0;
  font-family:'Roboto Mono',monospace; font-size:13px;
  padding:7px 10px; border:1px solid var(--border2); border-radius:4px;
  background:white; color:var(--text); outline:none;
}
.find-input:focus { border-color:var(--primary); }
#findCount { font-size:11px; color:var(--text2); white-space:nowrap; min-width:60px; text-align:center; }
#regexToggle {
  font-family:'Roboto Mono',monospace; font-size:13px; font-weight:700;
  padding:5px 10px; border:1px solid var(--border2); border-radius:4px;
  background:white; color:var(--text2); cursor:pointer; user-select:none;
}
#regexToggle.active { background:var(--primary); color:white; border-color:var(--primary); }

/* EDITOR AREA — the key fix:
   flex:1 + min-height:0 on the container.
   The textarea is a normal block element filling it.
   NO position:absolute, NO overflow:hidden on html/body,
   NO transparent text, NO z-index stacking.
   This is the only layout that works on Firefox Android. */
#editorArea {
  flex:1; min-height:0; display:flex;
}

#lineNums {
  width:46px; min-width:46px; flex-shrink:0;
  background:var(--surface2); border-right:1px solid var(--border);
  overflow:hidden; pointer-events:none; user-select:none;
  position:relative;
}
#lineNumsInner {
  position:absolute; top:0; left:0; right:0;
  padding:8px 6px 8px 0; text-align:right;
  font-family:'Roboto Mono',monospace; font-size:var(--fn); line-height:var(--lh);
  color:var(--text3); white-space:pre;
  will-change:transform;
}

/* THE TEXTAREA — dead simple, no tricks */
#editor {
  flex:1; display:block;
  font-family:'Roboto Mono',monospace; font-size:var(--fn); line-height:var(--lh);
  padding:8px 8px 250px 8px;
  border:none; outline:none; resize:none;
  background:var(--surface); color:var(--c-plain);
  caret-color:var(--primary);
  overflow-y:auto; overflow-x:hidden;
  white-space:pre-wrap; word-break:break-all;
  -webkit-overflow-scrolling:touch;
  -webkit-user-select:text; user-select:text;
}
#editor::selection { background:rgba(21,101,192,0.22); }

/* COMMIT BAR */
#commitBar {
  display:none; position:fixed; left:0; right:0; bottom:0;
  background:var(--surface); border-top:2px solid #388E3C;
  padding:10px; gap:8px; align-items:center;
  box-shadow:0 -2px 8px rgba(0,0,0,0.12); z-index:150;
}
#commitBar.show { display:flex; }
#commitMsg {
  flex:1; font-family:'Roboto',sans-serif; font-size:15px;
  padding:12px 14px; border:1px solid var(--border2); border-radius:6px;
  outline:none; color:var(--text); background:var(--surface); min-height:48px;
}
#commitMsg:focus { border-color:#388E3C; }

/* PAT SHEET */
#patModal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.45); z-index:200;
  align-items:flex-end; justify-content:center;
}
#patModal.show { display:flex; }
.modal-sheet {
  background:white; border-radius:16px 16px 0 0;
  padding:22px 20px 36px; width:100%; max-width:520px;
}
.modal-sheet h2 { font-size:16px; font-weight:500; margin-bottom:6px; }
.modal-sheet p  { font-size:12px; color:var(--text2); margin-bottom:14px; line-height:1.5; }
.modal-sheet input {
  width:100%; font-family:'Roboto Mono',monospace; font-size:13px;
  padding:10px 12px; border:1px solid var(--border2); border-radius:4px;
  outline:none; margin-bottom:14px; background:var(--surface2); color:var(--text);
}
.modal-sheet input:focus { border-color:var(--primary); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }

/* TOAST */
#toast {
  position:fixed; bottom:80px; left:50%;
  transform:translateX(-50%) translateY(64px);
  background:#323232; color:white; border-radius:4px;
  padding:10px 18px; font-size:13px; font-weight:500;
  transition:transform 0.22s ease; z-index:400;
  white-space:nowrap; box-shadow:var(--shadow2); pointer-events:none;
}
#toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="topBar">
  <div class="app-info">
    <div class="app-title">Filter Editor</div>
    <div class="app-file">My-Filters_Static_Sites.txt</div>
  </div>
  <div class="top-right">
    <div id="statusChip"><div id="sDot"></div><span id="sText">Not loaded</span></div>
    <button id="patTopBtn" onclick="showPat()">
      <div id="patDot"></div> PAT
    </button>
  </div>
</div>

<div id="toolbar">
  <button class="btn btn-raised" onclick="loadFile()">⬇ Load</button>
  <button class="btn btn-green" id="saveBtn" onclick="showCommit()" disabled>⬆ Save</button>
  <button class="btn btn-flat" onclick="toggleFind()">🔍 Find</button>
  <button class="btn btn-flat" onclick="pasteToEditor()">📋 Paste</button>
  <button class="btn btn-flat" onclick="copySelection()">⎘ Copy</button>
  <button class="btn btn-flat" onclick="goToLine()"># Line</button>
  <span id="modBadge">UNSAVED</span>
</div>

<div id="findBar">
  <div class="find-row">
    <input class="find-input" id="findInput" placeholder="Find..."
      oninput="doFind()" onkeydown="findKey(event)"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <span id="regexToggle" onclick="toggleRegex()">.*</span>
    <span id="findCount"></span>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="navFind(-1)">▲</button>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="navFind(1)">▼</button>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="toggleFind()">✕</button>
  </div>
  <div class="find-row">
    <input class="find-input" id="replaceInput" placeholder="Replace with..."
      autocomplete="off" spellcheck="false" />
    <button class="btn btn-flat" onclick="replaceCurrent()">Replace</button>
    <button class="btn btn-flat" onclick="replaceAll()">All</button>
  </div>
</div>

<div id="editorArea">
  <div id="lineNums"><div id="lineNumsInner">1</div></div>
  <textarea id="editor"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
    autocomplete="off"
    placeholder="Tap Load to fetch your filters..."
  ></textarea>
</div>

<div id="commitBar">
  <input id="commitMsg" type="text" placeholder="Commit message..." value="Update My-Filters" />
  <button class="btn btn-green" style="min-height:48px;font-size:14px;padding:10px 16px" onclick="saveFile()">✔ Commit</button>
  <button class="btn btn-flat" style="min-height:48px;font-size:13px;color:#C62828" onclick="hideCommit()">Cancel ✕</button>
</div>

<div id="patModal">
  <div class="modal-sheet">
    <h2>GitHub Token (PAT)</h2>
    <p>Required for saving only. Needs <b>repo</b> scope.<br>Stored in your browser — never committed to GitHub.</p>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    <div class="modal-actions">
      <button class="btn btn-flat" onclick="closePat()">Cancel</button>
      <button class="btn btn-raised" onclick="savePat()">Save Token</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const OWNER = 'BlazeFTL', REPO = 'My-Filters';
const FILE  = 'My-Filters_Static_Sites.txt';
const RAW   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/master/${FILE}`;
const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

const editor  = document.getElementById('editor');
const lnInner = document.getElementById('lineNumsInner');

let fileSha = null, originalContent = '';
let findMatches = [], findIdx = 0, regexMode = false, findOpen = false;

// ── LINE NUMBERS ──────────────────────────────────────
let lastLineCount = 0;
function rebuildLineNums() {
  const n = (editor.value.match(/\n/g) || []).length + 1;
  if (n === lastLineCount) return;
  lastLineCount = n;
  let s = '';
  for (let i = 1; i <= n; i++) s += i + '\n';
  lnInner.textContent = s;
}

// ── SCROLL SYNC ───────────────────────────────────────
editor.addEventListener('scroll', function() {
  lnInner.style.transform = 'translateY(-' + editor.scrollTop + 'px)';
});

// ── EDIT ─────────────────────────────────────────────
editor.addEventListener('input', function() {
  document.getElementById('modBadge').classList.toggle('show', editor.value !== originalContent);
  rebuildLineNums();
});

// ── LOAD ──────────────────────────────────────────────
async function loadFile(force) {
  if (!force && editor.value !== originalContent && editor.value.trim()) {
    if (!confirm('Unsaved changes. Load from GitHub and discard?')) return;
  }
  setStatus('loading', 'Fetching...');
  try {
    const r = await fetch(RAW + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    editor.value = text;
    originalContent = text;
    rebuildLineNums();
    const lc = text.split('\n').length;
    setStatus('ok', lc + ' lines');
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('modBadge').classList.remove('show');
    fetchSha();
    toast('Loaded — ' + lc + ' lines');
    requestAnimationFrame(() => {
      editor.scrollTop = editor.scrollHeight;
      lnInner.style.transform = 'translateY(-' + editor.scrollTop + 'px)';
    });
  } catch(e) {
    setStatus('err', 'Load failed');
    toast('Load failed: ' + e.message);
  }
}

async function fetchSha() {
  const pat = getPat();
  try {
    const r = await fetch(API, { headers: pat ? { Authorization: 'token ' + pat } : {} });
    const j = await r.json();
    fileSha = j.sha;
  } catch(e) {}
}

// ── FIND / REPLACE ────────────────────────────────────
function toggleFind() {
  findOpen = !findOpen;
  document.getElementById('findBar').classList.toggle('show', findOpen);
  if (findOpen) setTimeout(() => document.getElementById('findInput').focus(), 80);
  else { findMatches = []; document.getElementById('findCount').textContent = ''; }
}

function toggleRegex() {
  regexMode = !regexMode;
  document.getElementById('regexToggle').classList.toggle('active', regexMode);
  doFind();
}

function findKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); e.shiftKey ? navFind(-1) : navFind(1); }
}

function doFind() {
  const q = document.getElementById('findInput').value;
  findMatches = []; findIdx = 0;
  if (!q) { document.getElementById('findCount').textContent = ''; return; }
  try {
    const re = regexMode
      ? new RegExp(q, 'gi')
      : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let m;
    while ((m = re.exec(editor.value)) !== null) {
      findMatches.push({ start: m.index, len: m[0].length });
      if (re.lastIndex === m.index) re.lastIndex++;
    }
  } catch(e) { document.getElementById('findCount').textContent = 'Bad regex'; return; }
  updateFindCount();
  if (findMatches.length) scrollToMatch(0);
}

function navFind(dir) {
  if (!findMatches.length) return;
  findIdx = (findIdx + dir + findMatches.length) % findMatches.length;
  updateFindCount();
  scrollToMatch(findIdx);
}

function updateFindCount() {
  document.getElementById('findCount').textContent =
    findMatches.length ? (findIdx + 1) + '/' + findMatches.length : '0 found';
}

function scrollToMatch(idx) {
  const m = findMatches[idx];
  editor.focus();
  editor.setSelectionRange(m.start, m.start + m.len);
  const lh = parseFloat(getComputedStyle(editor).lineHeight) || 21;
  const line = editor.value.substring(0, m.start).split('\n').length - 1;
  editor.scrollTop = Math.max(0, line * lh - editor.clientHeight * 0.25);
  lnInner.style.transform = 'translateY(-' + editor.scrollTop + 'px)';
}

function replaceCurrent() {
  if (!findMatches.length) return;
  const rep = document.getElementById('replaceInput').value;
  const m = findMatches[findIdx];
  editor.value = editor.value.substring(0, m.start) + rep + editor.value.substring(m.start + m.len);
  document.getElementById('modBadge').classList.toggle('show', editor.value !== originalContent);
  doFind();
  toast('Replaced 1 match');
}

function replaceAll() {
  const q = document.getElementById('findInput').value;
  const rep = document.getElementById('replaceInput').value;
  if (!q) return;
  const n = findMatches.length;
  try {
    const re = regexMode
      ? new RegExp(q, 'g')
      : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    editor.value = editor.value.replace(re, rep);
  } catch(e) { toast('Bad regex'); return; }
  document.getElementById('modBadge').classList.toggle('show', editor.value !== originalContent);
  doFind();
  toast('Replaced ' + n + ' matches');
}

// ── GO TO LINE ────────────────────────────────────────
function goToLine() {
  const n = prompt('Go to line:');
  if (!n || isNaN(n)) return;
  const lines = editor.value.split('\n');
  const lineNum = Math.max(1, Math.min(parseInt(n), lines.length));
  let pos = 0;
  for (let i = 0; i < lineNum - 1; i++) pos += lines[i].length + 1;
  editor.focus();
  editor.setSelectionRange(pos, pos + lines[lineNum - 1].length);
  const lh = parseFloat(getComputedStyle(editor).lineHeight) || 21;
  editor.scrollTop = Math.max(0, (lineNum - 5) * lh);
  lnInner.style.transform = 'translateY(-' + editor.scrollTop + 'px)';
}

// ── COMMIT BAR ────────────────────────────────────────
function showCommit() {
  if (!getPat()) { showPat(); return; }
  document.getElementById('commitBar').classList.add('show');
  setTimeout(() => document.getElementById('commitMsg').focus(), 50);
}
function hideCommit() { document.getElementById('commitBar').classList.remove('show'); }

// ── SAVE ──────────────────────────────────────────────
async function saveFile() {
  const pat = getPat();
  if (!pat)     { toast('No PAT — tap PAT button'); return; }
  if (!fileSha) { toast('Load file first'); return; }
  const msg = document.getElementById('commitMsg').value || 'Update filters';
  const content = btoa(unescape(encodeURIComponent(editor.value)));
  setStatus('loading', 'Saving...');
  try {
    const r = await fetch(API, {
      method: 'PUT',
      headers: { Authorization: 'token ' + pat, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, content, sha: fileSha })
    });
    if (!r.ok) { const j = await r.json(); throw new Error(j.message || r.status); }
    const j = await r.json();
    fileSha = j.content.sha;
    originalContent = editor.value;
    document.getElementById('modBadge').classList.remove('show');
    setStatus('ok', editor.value.split('\n').length + ' lines');
    hideCommit();
    toast('Saved to GitHub ✓');
  } catch(e) {
    setStatus('err', 'Save failed');
    toast('Save failed: ' + e.message);
  }
}

// ── PAT ───────────────────────────────────────────────
function getPat() { return localStorage.getItem('blaze_pat') || ''; }
function updatePatIndicator() {
  document.getElementById('patDot').className = getPat() ? 'set' : '';
}
function showPat() {
  document.getElementById('patModal').classList.add('show');
  document.getElementById('patInput').value = getPat();
}
function closePat() { document.getElementById('patModal').classList.remove('show'); }
function savePat() {
  const v = document.getElementById('patInput').value.trim();
  if (v) { localStorage.setItem('blaze_pat', v); toast('Token saved'); }
  else   { localStorage.removeItem('blaze_pat'); toast('Token cleared'); }
  updatePatIndicator();
  closePat();
}

// ── COPY / PASTE ──────────────────────────────────────
function copySelection() {
  const s = editor.selectionStart, e2 = editor.selectionEnd;
  if (s === e2) { toast('No text selected'); return; }
  navigator.clipboard.writeText(editor.value.substring(s, e2))
    .then(() => toast('Copied'))
    .catch(() => { document.execCommand('copy'); toast('Copied'); });
}

async function pasteToEditor() {
  try {
    const text = await navigator.clipboard.readText();
    const s = editor.selectionStart, e2 = editor.selectionEnd;
    editor.value = editor.value.substring(0, s) + text + editor.value.substring(e2);
    editor.setSelectionRange(s + text.length, s + text.length);
    document.getElementById('modBadge').classList.toggle('show', editor.value !== originalContent);
    rebuildLineNums();
    toast('Pasted ' + text.split('\n').length + ' line(s)');
  } catch(e) {
    toast('Paste failed — use long-press instead');
  }
}

// ── STATUS / TOAST ────────────────────────────────────
function setStatus(state, txt) {
  document.getElementById('sDot').className = state;
  document.getElementById('sText').textContent = txt;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ──────────────────────────────────────────────
updatePatIndicator();
rebuildLineNums();
loadFile(true);
</script>
</body>
</html>
