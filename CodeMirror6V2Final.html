<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Filter Editor — BlazeFTL</title>
<script type="importmap">
{
  "imports": {
    "@codemirror/state":    "https://esm.sh/@codemirror/state@6.4.1?bundle",
    "@codemirror/view":     "https://esm.sh/@codemirror/view@6.26.3?bundle&external=@codemirror/state",
    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.3.3?bundle&external=@codemirror/state,@codemirror/view",
    "@codemirror/search":   "https://esm.sh/@codemirror/search@6.5.6?bundle&external=@codemirror/state,@codemirror/view,@codemirror/commands",
    "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1?bundle&external=@codemirror/state,@codemirror/view"
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');
:root{
--bg:#FAFAFA;--surface:#FFF;--surface2:#F5F5F5;--border:#E0E0E0;--border2:#BDBDBD;
--primary:#1565C0;--primary-light:#E3F2FD;--text:#212121;--text2:#757575;--text3:#BDBDBD;
--shadow:0 1px 3px rgba(0,0,0,.14);--shadow2:0 2px 8px rgba(0,0,0,.18);--fn:13px;
--c-comment:#8B93A1;--c-title:#2563EB;--c-except:#E11D48;--c-network:#0369A1;
--c-domain:#B45309;--c-sep:#0891B2;--c-selector:#334155;--c-scriptlet:#7C3AED;--c-option:#0F766E;--c-plain:#334155;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;display:flex;flex-direction:column}
#topBar{flex-shrink:0;background:var(--primary);color:#fff;padding:0 8px 0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow2);z-index:100;gap:6px}
.app-info{flex:1;min-width:0}
.app-title{font-size:15px;font-weight:500;white-space:nowrap}
.app-file{font-size:10px;opacity:.7;font-family:'Roboto Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
#statusChip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:12px;padding:4px 8px;font-size:10px;white-space:nowrap}
#sDot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s}
#sDot.ok{background:#69F0AE}#sDot.err{background:#FF5252}#sDot.loading{background:#FFD740;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#patTopBtn{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 8px;font-family:'Roboto',sans-serif;font-size:11px;font-weight:500;cursor:pointer}
#patTopBtn:active,.tb-ic:active{opacity:.7}
#patDot{width:9px;height:9px;border-radius:50%;background:#FF5252;flex-shrink:0}
#patDot.set{background:#69F0AE}
.tb-ic{width:30px;height:32px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;font-family:'Roboto',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
#toolbar{flex-shrink:0;background:var(--surface);border-bottom:2px solid var(--border);padding:5px 8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.btn{font-family:'Roboto',sans-serif;font-size:12px;font-weight:500;padding:6px 10px;border-radius:4px;border:none;cursor:pointer;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;min-height:32px;display:inline-flex;align-items:center;gap:4px}
.btn:active{opacity:.75;transform:scale(.96)}
.btn-flat{background:transparent;color:var(--primary)}
.btn-raised{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.btn-green{background:#388E3C;color:#fff;box-shadow:var(--shadow)}
.btn:disabled{opacity:.3;pointer-events:none}
#modBadge{display:none;font-size:10px;font-weight:700;background:#FF8F00;color:#fff;border-radius:10px;padding:2px 8px;letter-spacing:.5px}
#modBadge.show{display:inline-block}
#searchPanel{display:none;flex-shrink:0;background:#fff;border-bottom:2px solid var(--primary);padding:8px 10px;box-shadow:0 2px 8px rgba(21,101,192,.12);z-index:90;flex-direction:column;gap:6px}
#searchPanel.open{display:flex}
.sp-row,.sp-replace-row{display:flex;gap:6px;align-items:center}
.sp-field{flex:1;position:relative;display:flex;align-items:center}
.sp-field input{width:100%;font-family:'Roboto Mono',monospace;font-size:13px;padding:8px 86px 8px 12px;border:1.5px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);outline:none}
.sp-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,101,192,.12);background:#fff}
.sp-field input::placeholder{color:var(--text3)}
.sp-toggles{display:flex;gap:2px;position:absolute;right:8px}
.sp-tog{font-family:'Roboto Mono',monospace;font-size:10px;font-weight:700;padding:3px 6px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;line-height:1}
.sp-tog.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sp-nav-btns{display:flex;gap:4px;flex-shrink:0}
.sp-nav-btn{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.sp-nav-btn:active{background:var(--primary-light);border-color:var(--primary)}
.sp-close-btn{width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-close-btn:active{background:var(--surface2)}
.sp-replace-row input{flex:1;font-family:'Roboto Mono',monospace;font-size:13px;padding:8px 12px;border:1.5px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);outline:none}
.sp-replace-row input:focus{border-color:#388E3C;box-shadow:0 0 0 3px rgba(56,142,60,.12);background:#fff}
.sp-rep-btn{font-family:'Roboto',sans-serif;font-size:11px;font-weight:500;padding:6px 10px;border-radius:6px;border:1.5px solid var(--border2);background:var(--surface2);color:#388E3C;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.sp-rep-btn:active{background:#E8F5E9;border-color:#388E3C}
#spToggleReplace{font-size:11px;font-weight:500;color:var(--text2);background:none;border:none;cursor:pointer;padding:0 4px;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;font-family:'Roboto',sans-serif}
#editorArea{flex:1;overflow:hidden;position:relative;touch-action:pan-x pan-y}
#cmHost{width:100%;height:100%;overflow:auto;font-family:'Roboto Mono',monospace;font-size:var(--fn)}
.cm-editor{height:100%;background:var(--surface)!important;font-family:'Roboto Mono',monospace!important;font-size:var(--fn)!important}
.cm-editor.cm-focused{outline:none!important}
.cm-scroller{overflow:auto!important}
.cm-content{padding:8px 12px 250px 8px!important}
.cm-lineWrapping .cm-line,.cm-lineWrapping{word-break:break-all!important;overflow-wrap:anywhere!important}
.cm-lineNumbers .cm-gutterElement{font-size:var(--fn);color:var(--text3);padding:0 6px 0 8px;min-width:40px}
.cm-gutters{background:var(--surface2)!important;border-right:1px solid var(--border)!important;color:var(--text3)}
.cm-activeLine{background:rgba(21,101,192,.05)!important}
.cm-activeLineGutter{background:rgba(21,101,192,.08)!important}
.cm-selectionBackground,.cm-focused .cm-selectionBackground{background:rgba(21,101,192,.2)!important}
.cm-cursor{border-left-color:var(--primary)!important}
.cm-searchMatch{background:#FFF176!important;border-radius:2px}
.cm-searchMatch-selected{background:#FFD740!important;outline:2px solid #F57F17}
.cm-search{display:none!important}
.ub-comment{color:var(--c-comment)}
.ub-title{color:var(--c-title);font-weight:500}
.ub-except{color:var(--c-except);font-weight:500}
.ub-network{color:var(--c-network)}
.ub-domain{color:var(--c-domain)}
.ub-sep{color:var(--c-sep);font-weight:500}
.ub-selector{color:var(--c-selector)}
.ub-scriptlet{color:var(--c-scriptlet)}
.ub-option{color:var(--c-option)}
.ub-plain{color:var(--c-plain)}
#commitBar{display:none;position:fixed;left:0;right:0;background:var(--surface);border-top:2px solid #388E3C;padding:10px;gap:8px;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.12);z-index:150}
#commitBar.show{display:flex}
#commitMsg{flex:1;font-family:'Roboto',sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--border2);border-radius:6px;outline:none;color:var(--text);background:var(--surface);min-height:48px}
#commitMsg:focus{border-color:#388E3C;box-shadow:0 0 0 2px #C8E6C9}
#patModal,#setModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
#patModal.show,#setModal.show{display:flex}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;padding:22px 20px 36px;width:100%;max-width:520px}
.modal-sheet h2{font-size:16px;font-weight:500;margin-bottom:6px}
.modal-sheet p{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.modal-sheet input{width:100%;font-family:'Roboto Mono',monospace;font-size:13px;padding:10px 12px;border:1px solid var(--border2);border-radius:4px;outline:none;margin-bottom:14px;background:var(--surface2);color:var(--text)}
.modal-sheet input:focus{border-color:var(--primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--primary);font-size:20px;font-weight:700;cursor:pointer}
.stepper button:active{background:var(--primary-light)}
.stepper b{min-width:34px;text-align:center;font-family:'Roboto Mono',monospace;font-size:14px}
.sw{position:relative;width:46px;height:26px;border-radius:13px;border:none;background:var(--border2);cursor:pointer;transition:background .15s;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:transform .15s}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(20px)}
#setModal .modal-actions{margin-top:18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(64px);background:#323232;color:#fff;border-radius:4px;padding:10px 18px;font-size:13px;font-weight:500;transition:transform .22s ease;z-index:400;white-space:nowrap;box-shadow:var(--shadow2);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="topBar">
  <div class="app-info">
    <div class="app-title">Filter Editor</div>
    <div class="app-file">My-Filters_Static_Sites.txt</div>
  </div>
  <div class="top-right">
    <div id="statusChip"><div id="sDot"></div><span id="sText">Not loaded</span></div>
    <button id="patTopBtn" onclick="showPat()"><div id="patDot"></div>PAT</button>
    <button class="tb-ic" onclick="stepFs(-1)">A−</button>
    <button class="tb-ic" onclick="stepFs(1)">A+</button>
    <button class="tb-ic" style="font-size:16px" onclick="showSettings()">⚙</button>
  </div>
</div>

<div id="toolbar">
  <button class="btn btn-raised" onclick="loadFile()">⬇ Load</button>
  <button class="btn btn-green" id="saveBtn" onclick="showCommit()" disabled>⬆ Save</button>
  <button class="btn btn-flat" onclick="openSearchPanel()">🔍 Find</button>
  <button class="btn btn-flat" onclick="pasteToEditor()">📋 Paste</button>
  <button class="btn btn-flat" onclick="copySelection()">⎘ Copy</button>
  <button class="btn btn-flat" onclick="goToLine()"># Line</button>
  <span id="modBadge">UNSAVED</span>
</div>

<div id="searchPanel">
  <div class="sp-row">
    <div class="sp-field">
      <input id="spFind" type="text" placeholder="Find…" oninput="spSearch()" onkeydown="spKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <div class="sp-toggles">
        <button class="sp-tog" id="togCase" onclick="spToggle('case')">Aa</button>
        <button class="sp-tog" id="togWord" onclick="spToggle('word')">W</button>
        <button class="sp-tog" id="togRe" onclick="spToggle('re')">.*</button>
      </div>
    </div>
    <div class="sp-nav-btns">
      <button class="sp-nav-btn" onclick="spPrev()">↑</button>
      <button class="sp-nav-btn" onclick="spNext()">↓</button>
    </div>
    <span id="spCount" style="font-size:11px;font-weight:600;color:var(--primary);white-space:nowrap;min-width:52px;text-align:right"></span>
    <button id="spToggleReplace" onclick="spToggleReplaceRow()">Replace</button>
    <button class="sp-close-btn" onclick="spClearOrClose()">✕</button>
  </div>
  <div class="sp-replace-row" id="spReplaceRow" style="display:none">
    <input id="spReplace" type="text" placeholder="Replace with…" onkeydown="spRepKey(event)" autocomplete="off" spellcheck="false" />
    <button class="sp-rep-btn" onclick="spReplaceOne()">Replace</button>
    <button class="sp-rep-btn" onclick="spReplaceAll()">All</button>
  </div>
</div>

<div id="editorArea"><div id="cmHost"></div></div>

<div id="commitBar">
  <input id="commitMsg" type="text" placeholder="Commit message..." value="Update My-Filters" />
  <button class="btn btn-green" style="min-height:48px;font-size:14px;padding:10px 16px" onclick="saveFile()">✔ Commit</button>
  <button class="btn btn-flat" style="min-height:48px;font-size:13px;color:#C62828" onclick="hideCommit()">Cancel ✕</button>
</div>

<div id="patModal">
  <div class="modal-sheet">
    <h2>GitHub Token (PAT)</h2>
    <p>Required for saving only. Needs <b>repo</b> scope.<br>Stored in your browser — never committed to GitHub.</p>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    <div class="modal-actions">
      <button class="btn btn-flat" onclick="closePat()">Cancel</button>
      <button class="btn btn-raised" onclick="savePat()">Save Token</button>
    </div>
  </div>
</div>

<div id="setModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal-sheet">
    <h2>Settings</h2>
    <div class="set-row"><span>Font size</span>
      <div class="stepper"><button onclick="stepFs(-1)">−</button><b id="fsVal"></b><button onclick="stepFs(1)">+</button></div>
    </div>
    <div class="set-row"><span>Word wrap</span><button class="sw" id="swWrap" onclick="toggleSet('wrap')"></button></div>
    <div class="set-row"><span>Syntax highlighting</span><button class="sw" id="swHl" onclick="toggleSet('hl')"></button></div>
    <p style="margin:12px 0 0">Pinch with two fingers on the editor to zoom text.</p>
    <div class="modal-actions"><button class="btn btn-raised" onclick="closeSettings()">Done</button></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { EditorState, Compartment } from '@codemirror/state';
import {
  EditorView, lineNumbers, highlightActiveLine, highlightActiveLineGutter, drawSelection,
  keymap, ViewPlugin, Decoration, rectangularSelection, crosshairCursor,
  highlightSpecialChars, dropCursor
} from '@codemirror/view';
import {
  defaultKeymap, history, historyKeymap, indentWithTab,
  deleteLine, moveLineUp, moveLineDown, copyLineUp, copyLineDown
} from '@codemirror/commands';
import {
  search, searchKeymap, SearchQuery, setSearchQuery, findNext, findPrevious,
  replaceNext, replaceAll as cmReplaceAll, selectNextOccurrence
} from '@codemirror/search';

const OWNER = 'BlazeFTL', REPO = 'My-Filters';
const FILE  = 'My-Filters_Static_Sites.txt';
const RAW   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/refs/heads/master/${FILE}`;
const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

let fileSha = null, originalContent = '';

function getPat() { return localStorage.getItem('blaze_pat') || ''; }
function updatePatIndicator() { document.getElementById('patDot').className = getPat() ? 'set' : ''; }
window.showPat = function() {
  document.getElementById('patModal').classList.add('show');
  document.getElementById('patInput').value = getPat();
};
window.closePat = function() { document.getElementById('patModal').classList.remove('show'); };
window.savePat = function() {
  const v = document.getElementById('patInput').value.trim();
  if (v) { localStorage.setItem('blaze_pat', v); toast('Token saved'); }
  else   { localStorage.removeItem('blaze_pat'); toast('Token cleared'); }
  updatePatIndicator();
  closePat();
};

let S = { fs: 13, wrap: true, hl: true };
try { Object.assign(S, JSON.parse(localStorage.getItem('blaze_set') || '{}')); } catch(e) {}
function saveS() { try { localStorage.setItem('blaze_set', JSON.stringify(S)); } catch(e) {} }
const wrapC = new Compartment(), hlC = new Compartment();

const uboHighlighter = ViewPlugin.fromClass(
  class {
    constructor(view) { this.decorations = buildDecos(view); }
    update(u) { if (u.docChanged || u.viewportChanged) this.decorations = buildDecos(u.view); }
  },
  { decorations: v => v.decorations }
);

function buildDecos(view) {
  const builder = [];
  const { from: vpFrom, to: vpTo } = view.viewport;
  const doc = view.state.doc;
  for (let pos = vpFrom; pos <= vpTo; ) {
    const line = doc.lineAt(pos);
    addLineDecos(builder, line.from, line.text);
    pos = line.to + 1;
  }
  builder.sort((a, b) => a.from - b.from || a.startSide - b.startSide);
  return Decoration.set(builder, true);
}

function span(b, from, to, cls) { if (from < to) b.push(Decoration.mark({ class: cls }).range(from, to)); }

function addLineDecos(b, base, text) {
  if (!text.trim()) return;
  if (/^[!#]/.test(text)) {
    if (/^!\s*(Title|Version|Last modified|Expires|Description|License|Homepage|Forums):/i.test(text)) {
      const m = text.match(/^(!\s*[^:]+:)(.*)/);
      if (m) {
        span(b, base, base + m[1].length, 'ub-title');
        span(b, base + m[1].length, base + text.length, 'ub-comment');
        return;
      }
    }
    span(b, base, base + text.length, 'ub-comment');
    return;
  }
  if (text.startsWith('@@')) {
    span(b, base, base + 2, 'ub-except');
    addNetworkDecos(b, base + 2, text.slice(2));
    return;
  }
  const htmlIdx = text.indexOf('##^');
  if (htmlIdx > 0) {
    span(b, base, base + htmlIdx, 'ub-domain');
    span(b, base + htmlIdx, base + htmlIdx + 3, 'ub-sep');
    span(b, base + htmlIdx + 3, base + text.length, 'ub-scriptlet');
    return;
  }
  const sm = text.match(/^(.+?)(#[@+]?#\+js\(|#\+js\()(.*)/);
  if (sm) {
    const a = sm[1].length, c = a + sm[2].length;
    span(b, base, base + a, 'ub-domain');
    span(b, base + a, base + c, 'ub-sep');
    span(b, base + c, base + text.length, 'ub-scriptlet');
    return;
  }
  const cm_ = text.match(/^(.+?)(#[@$%?]{0,2}#)(.*)/);
  if (cm_) {
    const a = cm_[1].length, c = a + cm_[2].length;
    span(b, base, base + a, 'ub-domain');
    span(b, base + a, base + c, 'ub-sep');
    span(b, base + c, base + text.length, 'ub-selector');
    return;
  }
  if (/^\|\||^\*|^\^/.test(text) || /\$[a-z]/.test(text)) { addNetworkDecos(b, base, text); return; }
  span(b, base, base + text.length, 'ub-plain');
}

function addNetworkDecos(b, base, text) {
  const i = text.lastIndexOf('$');
  if (i > 0 && !/^https?:\/\//.test(text)) {
    span(b, base, base + i, 'ub-network');
    span(b, base + i, base + text.length, 'ub-option');
  } else {
    span(b, base, base + text.length, 'ub-network');
  }
}

function scrollMatchToCenter(pos) {
  view.dispatch({ effects: EditorView.scrollIntoView(pos, { y: 'center', yMargin: 80 }) });
}

const updateListener = EditorView.updateListener.of(u => {
  if (u.docChanged) {
    const cur = u.state.doc.toString();
    document.getElementById('modBadge').classList.toggle('show', cur !== originalContent);
    if (document.getElementById('searchPanel').classList.contains('open')) updateMatchCount();
  }
});

const view = new EditorView({
  state: EditorState.create({
    doc: '',
    extensions: [
      lineNumbers(), highlightActiveLine(), highlightActiveLineGutter(), highlightSpecialChars(),
      drawSelection(), dropCursor(), rectangularSelection(), crosshairCursor(), history(),
      search({ top: true }),
      keymap.of([
        ...defaultKeymap, ...historyKeymap, ...searchKeymap, indentWithTab,
        { key: 'Mod-d', run: selectNextOccurrence },
        { key: 'Ctrl-l', run: () => { goToLine(); return true; } },
        { key: 'Alt-ArrowUp', run: moveLineUp },
        { key: 'Alt-ArrowDown', run: moveLineDown },
        { key: 'Shift-Alt-ArrowUp', run: copyLineUp },
        { key: 'Shift-Alt-ArrowDown', run: copyLineDown },
        { key: 'Mod-Shift-k', run: deleteLine },
        { key: 'Escape', run: () => { closeSearchPanel(); return false; } },
        { key: 'Mod-f', run: () => { openSearchPanel(); return true; } },
        { key: 'Mod-h', run: () => { openSearchPanel(true); return true; } },
      ]),
      wrapC.of(S.wrap ? EditorView.lineWrapping : []),
      hlC.of(S.hl ? uboHighlighter : []),
      updateListener,
      EditorView.theme({
        '&': { height: '100%', background: 'var(--surface)' },
        '.cm-scroller': { fontFamily: "'Roboto Mono',monospace", fontSize: 'var(--fn)' },
      }),
    ],
  }),
  parent: document.getElementById('cmHost'),
});
window._view = view;

function setFs(v, keep) {
  S.fs = Math.max(8, Math.min(40, Math.round(v * 2) / 2));
  document.documentElement.style.setProperty('--fn', S.fs + 'px');
  document.getElementById('fsVal').textContent = S.fs;
  if (!keep) saveS();
  const pos = view.lineBlockAtHeight(view.scrollDOM.scrollTop).from;
  view.requestMeasure();
  requestAnimationFrame(() => view.dispatch({ effects: EditorView.scrollIntoView(pos, { y: 'start', yMargin: 0 }) }));
}
window.stepFs = d => setFs(S.fs + d);

function syncSettingsUi() {
  document.getElementById('swWrap').classList.toggle('on', S.wrap);
  document.getElementById('swHl').classList.toggle('on', S.hl);
  document.getElementById('fsVal').textContent = S.fs;
}
window.toggleSet = function(k) {
  S[k] = !S[k];
  saveS();
  view.dispatch({ effects: k === 'wrap'
    ? wrapC.reconfigure(S.wrap ? EditorView.lineWrapping : [])
    : hlC.reconfigure(S.hl ? uboHighlighter : []) });
  syncSettingsUi();
};
window.showSettings = function() { syncSettingsUi(); document.getElementById('setModal').classList.add('show'); };
window.closeSettings = function() { document.getElementById('setModal').classList.remove('show'); };

const ea = document.getElementById('editorArea');
let pinchD = 0, pinchFs = 0;
const tDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
ea.addEventListener('touchstart', e => {
  if (e.touches.length === 2) { pinchD = tDist(e.touches); pinchFs = S.fs; }
}, { capture: true, passive: true });
ea.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchD) {
    e.preventDefault(); e.stopPropagation();
    setFs(pinchFs * tDist(e.touches) / pinchD, true);
  }
}, { capture: true, passive: false });
const pinchEnd = e => { if (e.touches.length < 2 && pinchD) { pinchD = 0; saveS(); } };
ea.addEventListener('touchend', pinchEnd, { capture: true, passive: true });
ea.addEventListener('touchcancel', pinchEnd, { capture: true, passive: true });

let spState = { caseSensitive: false, wholeWord: false, regexp: false, replaceVisible: false };

window.openSearchPanel = function(withReplace = false) {
  document.getElementById('searchPanel').classList.add('open');
  if (withReplace) {
    spState.replaceVisible = true;
    document.getElementById('spReplaceRow').style.display = 'flex';
  }
  const sel = view.state.sliceDoc(view.state.selection.main.from, view.state.selection.main.to);
  const findEl = document.getElementById('spFind');
  if (sel && sel.length < 200 && !sel.includes('\n')) findEl.value = sel;
  setTimeout(() => { findEl.focus(); findEl.select(); }, 30);
  spSearch();
};

window.closeSearchPanel = function() {
  document.getElementById('searchPanel').classList.remove('open');
  document.getElementById('spCount').textContent = '';
  view.focus();
};

window.spClearOrClose = function() {
  const findEl = document.getElementById('spFind');
  if (findEl.value) { findEl.value = ''; spSearch(); findEl.focus(); }
  else closeSearchPanel();
};

window.spToggleReplaceRow = function() {
  spState.replaceVisible = !spState.replaceVisible;
  document.getElementById('spReplaceRow').style.display = spState.replaceVisible ? 'flex' : 'none';
  if (spState.replaceVisible) document.getElementById('spReplace').focus();
};

window.spToggle = function(type) {
  if (type === 'case') spState.caseSensitive = !spState.caseSensitive;
  if (type === 'word') spState.wholeWord = !spState.wholeWord;
  if (type === 're')   spState.regexp = !spState.regexp;
  document.getElementById('togCase').classList.toggle('on', spState.caseSensitive);
  document.getElementById('togWord').classList.toggle('on', spState.wholeWord);
  document.getElementById('togRe').classList.toggle('on', spState.regexp);
  spSearch();
};

function buildSearchQuery(searchStr, replaceStr = '') {
  return new SearchQuery({
    search: searchStr, replace: replaceStr,
    caseSensitive: spState.caseSensitive, wholeWord: spState.wholeWord, regexp: spState.regexp,
  });
}

function countMatchesAndFirst(q) {
  try {
    const query = buildSearchQuery(q);
    if (!query.valid) return { count: 0, firstPos: -1, firstTo: -1 };
    const cursor = query.getCursor(view.state.doc);
    let count = 0, firstPos = -1, firstTo = -1;
    while (!cursor.next().done) {
      if (count === 0) { firstPos = cursor.value.from; firstTo = cursor.value.to; }
      count++;
    }
    return { count, firstPos, firstTo };
  } catch(e) { return { count: 0, firstPos: -1, firstTo: -1 }; }
}

function updateMatchCount() {
  const q = document.getElementById('spFind').value;
  if (!q) { document.getElementById('spCount').textContent = ''; return; }
  const { count } = countMatchesAndFirst(q);
  document.getElementById('spCount').textContent = count === 0 ? 'No matches' : count + ' matches';
}

window.spSearch = function() {
  const q = document.getElementById('spFind').value;
  if (!q) {
    document.getElementById('spCount').textContent = '';
    view.dispatch({
      selection: { anchor: view.state.selection.main.head },
      effects: setSearchQuery.of(buildSearchQuery('')),
    });
    return;
  }
  try {
    const query = buildSearchQuery(q);
    const { count, firstPos, firstTo } = countMatchesAndFirst(q);
    document.getElementById('spCount').textContent = count === 0 ? 'No matches' : count + ' matches';
    if (firstPos >= 0) {
      view.dispatch({
        selection: { anchor: firstPos, head: firstTo },
        effects: [setSearchQuery.of(query), EditorView.scrollIntoView(firstPos, { y: 'center', yMargin: 80 })],
      });
    } else {
      view.dispatch({ effects: setSearchQuery.of(query) });
    }
  } catch(e) {}
};

function spStep(fn) {
  const q = document.getElementById('spFind').value;
  if (!q) return;
  view.dispatch({ effects: setSearchQuery.of(buildSearchQuery(q)) });
  fn(view);
  requestAnimationFrame(() => {
    scrollMatchToCenter(view.state.selection.main.from);
    setTimeout(() => document.getElementById('spFind').focus(), 30);
  });
}
window.spNext = () => spStep(findNext);
window.spPrev = () => spStep(findPrevious);

window.spReplaceOne = function() {
  const q = document.getElementById('spFind').value;
  const r = document.getElementById('spReplace').value;
  if (!q) return;
  view.dispatch({ effects: setSearchQuery.of(buildSearchQuery(q, r)) });
  replaceNext(view);
  updateMatchCount();
};

window.spReplaceAll = function() {
  const q = document.getElementById('spFind').value;
  const r = document.getElementById('spReplace').value;
  if (!q) return;
  view.dispatch({ effects: setSearchQuery.of(buildSearchQuery(q, r)) });
  if (cmReplaceAll(view)) toast('Replaced all occurrences');
  updateMatchCount();
};

window.spKey = function(e) {
  if (e.key === 'Enter') { e.shiftKey ? spPrev() : spNext(); e.preventDefault(); }
  if (e.key === 'Escape') { closeSearchPanel(); e.preventDefault(); }
};
window.spRepKey = function(e) {
  if (e.key === 'Enter') { spReplaceOne(); e.preventDefault(); }
  if (e.key === 'Escape') { closeSearchPanel(); e.preventDefault(); }
};

window.goToLine = function() {
  const total = view.state.doc.lines;
  const cur = view.state.doc.lineAt(view.state.selection.main.head).number;
  const n = prompt(`Go to line (1–${total}):`, cur);
  if (!n || isNaN(n)) return;
  const line = view.state.doc.line(Math.max(1, Math.min(parseInt(n), total)));
  view.dispatch({
    selection: { anchor: line.from, head: line.to },
    effects: EditorView.scrollIntoView(line.from, { y: 'center' }),
  });
  view.focus();
};

window.copySelection = function() {
  const sel = view.state.sliceDoc(view.state.selection.main.from, view.state.selection.main.to);
  if (!sel) { toast('No text selected'); return; }
  navigator.clipboard.writeText(sel)
    .then(() => toast(`Copied ${sel.split('\n').length} line(s)`))
    .catch(() => toast('Copy failed'));
};

window.pasteToEditor = async function() {
  try {
    const text = await navigator.clipboard.readText();
    const { from, to } = view.state.selection.main;
    view.dispatch({ changes: { from, to, insert: text }, selection: { anchor: from + text.length } });
    toast(`Pasted ${text.split('\n').length} line(s)`);
  } catch(e) { toast('Paste failed — use long-press instead'); }
};

window.loadFile = async function(force) {
  const cur = view.state.doc.toString();
  if (!force && cur !== originalContent && cur.trim()) {
    if (!confirm('Unsaved changes. Load from GitHub and discard?')) return;
  }
  setStatus('loading', 'Fetching...');
  try {
    const r = await fetch(RAW + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } });
    originalContent = text;
    document.getElementById('modBadge').classList.remove('show');
    const lc = text.split('\n').length;
    setStatus('ok', lc + ' lines');
    document.getElementById('saveBtn').disabled = false;
    fetchSha();
    toast('Loaded — ' + lc + ' lines');
    requestAnimationFrame(() => view.dispatch({ effects: EditorView.scrollIntoView(view.state.doc.length) }));
  } catch(e) {
    setStatus('err', 'Load failed');
    toast('Load failed: ' + e.message);
  }
};

async function fetchSha() {
  const pat = getPat();
  if (!pat) return;
  try {
    const r = await fetch(API, { headers: { Authorization: 'token ' + pat } });
    if (!r.ok) return;
    fileSha = (await r.json()).sha;
  } catch(e) {}
}

window.showCommit = function() {
  if (!getPat()) { showPat(); return; }
  document.getElementById('commitBar').classList.add('show');
  positionCommitBar();
  setTimeout(() => document.getElementById('commitMsg').focus(), 50);
};
window.hideCommit = function() { document.getElementById('commitBar').classList.remove('show'); };

function positionCommitBar() {
  const bar = document.getElementById('commitBar');
  if (!bar.classList.contains('show')) return;
  if (window.visualViewport) {
    const vv = window.visualViewport;
    bar.style.bottom = (window.innerHeight - vv.height - vv.offsetTop) + 'px';
  } else bar.style.bottom = '0px';
}
function syncViewport() {
  if (window.visualViewport) {
    document.body.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
  }
  positionCommitBar();
  requestAnimationFrame(() => view.dispatch({ effects: EditorView.scrollIntoView(view.state.selection.main.head) }));
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}

window.saveFile = async function() {
  const pat = getPat();
  if (!pat)     { toast('No PAT — tap PAT button'); return; }
  if (!fileSha) { toast('Load file first'); return; }
  const msg = document.getElementById('commitMsg').value || 'Update filters';
  const content = btoa(unescape(encodeURIComponent(view.state.doc.toString())));
  setStatus('loading', 'Saving...');
  try {
    const r = await fetch(API, {
      method: 'PUT',
      headers: { Authorization: 'token ' + pat, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, content, sha: fileSha }),
    });
    if (!r.ok) { const j = await r.json(); throw new Error(j.message || r.status); }
    const j = await r.json();
    fileSha = j.content.sha;
    originalContent = view.state.doc.toString();
    document.getElementById('modBadge').classList.remove('show');
    setStatus('ok', view.state.doc.lines + ' lines');
    hideCommit();
    toast('Saved to GitHub ✓');
  } catch(e) {
    setStatus('err', 'Save failed');
    toast('Save failed: ' + e.message);
  }
};

function setStatus(state, text) {
  document.getElementById('sDot').className = state;
  document.getElementById('sText').textContent = text;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

updatePatIndicator();
syncSettingsUi();
document.documentElement.style.setProperty('--fn', S.fs + 'px');
loadFile(true);
</script>
