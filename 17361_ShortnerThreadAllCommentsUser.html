<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Discussion Search — uAssets #17361</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');
:root {
--bg:#F5F5F5; --surface:#FFFFFF; --surface2:#FAFAFA;
--card:#FFFFFF; --border:#E0E0E0; --border2:#BDBDBD;
--primary:#1565C0; --primary-light:#E3F2FD; --primary-dark:#0D47A1;
--accent2:#E65100; --text:#212121; --text2:#757575; --text3:#BDBDBD;
--success:#2E7D32; --warn:#F57F17; --danger:#C62828;
--shadow:0 1px 3px rgba(0,0,0,0.12); --shadow2:0 2px 8px rgba(0,0,0,0.16);
--code-bg:#F6F8FA; --code-border:#E1E4E8;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; min-height:100vh; }
/* ── APP BAR ────────────────────────────────────────────── */
#appBar {
background:var(--primary); color:white;
padding:0 12px; height:56px;
display:flex; align-items:center; justify-content:space-between;
box-shadow:var(--shadow2); position:sticky; top:0; z-index:200;
gap:8px;
}
.bar-left { display:flex; flex-direction:column; flex-shrink:0; min-width:0; }
.bar-title { font-size:17px; font-weight:500; letter-spacing:0.3px; }
.bar-sub { font-size:11px; opacity:0.75; margin-top:1px; }
#barRight { display:flex; align-items:center; gap:8px; flex-shrink:0; }
#cacheAge {
font-size:11px; font-weight:500; opacity:0.85;
white-space:nowrap; padding:3px 8px;
background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
border-radius:12px; display:none;
}
#cacheAge.show { display:block; }
#reloadBtn {
background:rgba(255,255,255,0.18); color:white;
border:1px solid rgba(255,255,255,0.35);
border-radius:5px; font-size:12px; font-weight:600;
padding:6px 11px; cursor:pointer; white-space:nowrap;
font-family:'Roboto',sans-serif; letter-spacing:0.2px;
transition:background 0.15s; display:none;
}
#reloadBtn.show { display:block; }
#reloadBtn:active { background:rgba(255,255,255,0.3); }
#barStats {
font-size:13px; font-weight:600;
white-space:nowrap; flex-shrink:0;
background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
border-radius:6px; padding:4px 8px; letter-spacing:0.3px;
}
/* ── SEARCH BAR ─────────────────────────────────────────── */
#searchBar {
background:var(--surface); border-bottom:1px solid var(--border);
padding:8px 12px; position:sticky; top:56px; z-index:190;
box-shadow:var(--shadow);
}
.search-wrap { position:relative; }
#searchInput {
width:100%; background:var(--surface2); border:1.5px solid var(--border);
border-radius:8px; color:var(--text); font-family:'Roboto',sans-serif;
font-size:15px; padding:10px 50px 10px 40px; outline:none;
transition:border-color 0.15s, box-shadow 0.15s;
}
#searchInput:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); background:#fff; }
#searchInput:disabled { opacity:0.4; }
#searchInput::placeholder { color:var(--text3); }
.search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text3); pointer-events:none; }
#resultCount { position:absolute; right:38px; top:50%; transform:translateY(-50%); font-size:11px; font-weight:700; color:var(--primary); }
#searchClear {
position:absolute; right:10px; top:50%; transform:translateY(-50%);
width:22px; height:22px; border-radius:50%; border:none;
background:var(--border2); color:var(--text2);
font-size:13px; line-height:1; cursor:pointer;
display:none; align-items:center; justify-content:center;
padding:0; font-family:'Roboto',sans-serif; transition:background 0.15s;
}
#searchClear.show { display:flex; }
#searchClear:active { background:var(--text3); }
/* ── FILTER CHIPS ───────────────────────────────────────── */
#filterRow {
display:none; background:var(--surface); border-bottom:1px solid var(--border);
padding:8px 12px; gap:6px; flex-wrap:wrap; align-items:center; overflow-x:auto;
}
#filterRow.show { display:flex; }
.chip {
font-size:12px; font-weight:500; padding:5px 12px;
border-radius:16px; border:1.5px solid var(--border);
background:transparent; color:var(--text2);
cursor:pointer; transition:all 0.15s; white-space:nowrap;
font-family:'Roboto',sans-serif; letter-spacing:0.2px;
}
.chip.active { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
/* ── PROGRESS ───────────────────────────────────────────── */
#progressWrap {
display:none; background:var(--surface); border-bottom:1px solid var(--border);
padding:12px 16px;
}
#progressLabel { font-size:12px; color:var(--text2); margin-bottom:8px; font-weight:500; }
#progressBar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
#progressFill { height:100%; background:var(--primary); width:0%; transition:width 0.3s; border-radius:2px; }
/* ── ERROR PANEL ────────────────────────────────────────── */
#errorPanel {
display:none; background:var(--surface); border-bottom:1px solid var(--border);
padding:24px 16px; text-align:center;
}
#errorPanel .err-icon { font-size:32px; margin-bottom:8px; }
#errorPanel .err-msg { font-size:14px; color:var(--danger); font-weight:500; margin-bottom:4px; }
#errorPanel .err-hint { font-size:12px; color:var(--text2); }
#errorPanel .btn { margin-top:14px; }
/* ── RESULTS ────────────────────────────────────────────── */
#results { padding:8px 0 100px; }
.no-results { padding:48px 16px; text-align:center; color:var(--text2); font-size:14px; }
.no-results strong { color:var(--primary); }
.no-results .hint { font-size:12px; color:var(--text3); margin-top:8px; display:block; }
/* ── THREAD GROUPS ──────────────────────────────────────── */
.thread-group {
margin:12px 12px 20px; border-radius:10px;
border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow);
}
.thread-group .result-card { margin:0; border:none; border-radius:0; box-shadow:none; }
.thread-group .result-card.is-reply {
border-top:1px solid var(--border);
background:#FAFBFF; position:relative;
border-left:6px solid #e74c3c !important;
}
.thread-group .result-card.is-reply::before { display:none; }
.thread-group .result-card.is-reply .card-header,
.thread-group .result-card.is-reply .card-body,
.thread-group .result-card.is-reply .card-footer { padding-left:20px; }
.result-card {
background:var(--card); margin:8px 12px;
border-radius:8px; border:1px solid var(--border);
box-shadow:var(--shadow); overflow:hidden; transition:box-shadow 0.15s;
}
.result-card:hover { box-shadow:var(--shadow2); }
.card-header {
display:flex; align-items:center; gap:8px;
padding:10px 14px 8px; border-bottom:1px solid var(--border);
background:var(--surface2);
}
.avatar { width:28px; height:28px; border-radius:50%; background:var(--border); overflow:hidden; flex-shrink:0; }
.avatar img { width:100%; height:100%; }
.author { font-size:13px; font-weight:500; color:var(--primary); }
.author.blaze { color:var(--accent2); font-weight:700; }
.card-badges { display:flex; gap:4px; margin-left:auto; align-items:center; }
.badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:0.4px; text-transform:uppercase; }
.badge-reply { background:#FFF3E0; color:#E65100; border:1px solid #FFE0B2; }
.badge-blaze { background:#FBE9E7; color:#BF360C; border:1px solid #FFCCBC; }
.card-date { font-size:11px; color:var(--text3); }
.card-body { padding:12px 14px; font-size:13px; line-height:1.7; color:var(--text); word-break:break-word; overflow-x:auto; }
.card-body h1,.card-body h2,.card-body h3 { font-weight:600; margin:12px 0 6px; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:4px; }
.card-body h1 { font-size:16px; } .card-body h2 { font-size:15px; } .card-body h3 { font-size:14px; }
.card-body p { margin:6px 0; }
.card-body ul,.card-body ol { padding-left:20px; margin:6px 0; }
.card-body li { margin:2px 0; }
.card-body a { color:var(--primary); word-break:break-all; }
.card-body code { background:var(--code-bg); border:1px solid var(--code-border); border-radius:3px; font-family:'Roboto Mono',monospace; font-size:12px; padding:1px 5px; }
.card-body pre { background:var(--code-bg); border:1px solid var(--code-border); border-radius:6px; padding:10px 12px; overflow-x:auto; margin:8px 0; line-height:1.5; }
.card-body pre code { background:none; border:none; padding:0; font-size:12px; white-space:pre; display:block; }
.card-body blockquote { border-left:3px solid var(--border2); margin:8px 0; padding:4px 12px; color:var(--text2); font-style:italic; }
.card-body table { border-collapse:collapse; width:100%; margin:8px 0; font-size:12px; }
.card-body th,.card-body td { border:1px solid var(--border); padding:6px 10px; }
.card-body th { background:var(--surface2); font-weight:600; }
.card-body img { max-width:100%; border-radius:4px; }
.card-body hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
.card-body .gh-alert { border-radius:6px; padding:10px 14px; margin:8px 0; border-left:4px solid; font-size:13px; }
.card-body .gh-alert-tip { background:#F0FFF4; border-color:#2E7D32; }
.card-body .gh-alert-note { background:#E3F2FD; border-color:#1565C0; }
.card-body .gh-alert-warning { background:#FFF8E1; border-color:#F57F17; }
.card-body .gh-alert-important{ background:#EDE7F6; border-color:#6A1B9A; }
.card-body .gh-alert-caution { background:#FFEBEE; border-color:#C62828; }
.card-body .gh-alert-title { font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.card-body details { margin:8px 0; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.card-body summary { padding:8px 12px; cursor:pointer; font-weight:500; font-size:13px; background:var(--surface2); user-select:none; list-style:none; display:flex; align-items:center; gap:6px; }
.card-body summary::before { content:'▶'; font-size:10px; transition:transform 0.2s; }
.card-body details[open] summary::before { transform:rotate(90deg); }
.card-body details > *:not(summary) { padding:10px 12px; }
mark { background:rgba(255,213,0,0.5); color:var(--text); border-radius:2px; padding:0 1px; }
.card-footer { padding:6px 14px 8px; border-top:1px solid var(--border); display:flex; align-items:center; }
.card-link { font-size:11px; color:var(--text3); text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
.card-link:hover { color:var(--primary); }
/* ── SCROLL BUTTONS ─────────────────────────────────────── */
#scrollTop, #scrollBottom {
position:fixed; width:44px; height:44px;
background:var(--primary); color:white; border:none; border-radius:50%;
font-size:20px; cursor:pointer; display:none; align-items:center;
justify-content:center; box-shadow:var(--shadow2); z-index:200;
}
#scrollTop { bottom:76px; right:16px; }
#scrollBottom { bottom:24px; right:16px; }
#scrollTop.show { display:flex; }
#scrollBottom.show { display:flex; }
/* ── TOAST ──────────────────────────────────────────────── */
#toast {
position:fixed; bottom:24px; left:50%;
transform:translateX(-50%) translateY(64px);
background:#323232; color:white; border-radius:6px;
padding:10px 20px; font-size:13px; font-weight:500;
transition:transform 0.22s ease; z-index:500;
white-space:nowrap; box-shadow:var(--shadow2); pointer-events:none;
max-width:calc(100vw - 40px); text-align:center;
}
#toast.show { transform:translateX(-50%) translateY(0); }
#toast.ok { background:var(--success); }
#toast.err { background:var(--danger); }
#toast.info { background:var(--primary); }
.btn {
font-family:'Roboto',sans-serif; font-size:13px; font-weight:500;
padding:8px 16px; border-radius:6px; cursor:pointer;
display:inline-flex; align-items:center; gap:6px;
transition:all 0.15s; white-space:nowrap; letter-spacing:0.3px;
text-transform:uppercase;
}
.btn:active { transform:scale(0.96); opacity:0.85; }
.btn-primary { background:var(--primary); color:white; border:none; box-shadow:var(--shadow); }
</style>
</head>
<body>
<!-- APP BAR -->
<div id="appBar">
<div class="bar-left">
<div class="bar-title">Discussion Search</div>
<div class="bar-sub">uAssets · #17361</div>
</div>
<div id="barRight">
<span id="cacheAge"></span>
<button id="reloadBtn" onclick="reloadCache()">↺ Reload</button>
<div id="barStats">Loading…</div>
</div>
</div>

<!-- SEARCH -->
<div id="searchBar">
<div class="search-wrap">
<span class="search-icon">🔍</span>
<input type="search" id="searchInput" placeholder="Search comments & replies…"
oninput="onSearchInput()" disabled autocorrect="off" autocapitalize="off" />
<span id="resultCount"></span>
<button id="searchClear" onclick="clearSearch()" title="Clear">✕</button>
</div>
</div>

<!-- FILTER CHIPS -->
<div id="filterRow">
<div class="chip active" onclick="setFilter('all',this)">All</div>
<div class="chip" onclick="setFilter('blazeftl',this)">BlazeFTL only</div>
<div class="chip" onclick="setFilter('code',this)">Has filter rule</div>
<div class="chip" onclick="setFilter('replies',this)">Replies only</div>
<div class="chip" onclick="setFilter('comments',this)">Top-level only</div>
</div>

<!-- PROGRESS -->
<div id="progressWrap">
<div id="progressLabel">Loading…</div>
<div id="progressBar"><div id="progressFill"></div></div>
</div>

<!-- ERROR PANEL -->
<div id="errorPanel">
<div class="err-icon">⚠️</div>
<div class="err-msg" id="errorMsg">Failed to load data</div>
<div class="err-hint">Could not reach the cache. Check your connection and try again.</div>
<button class="btn btn-primary" onclick="reloadCache()" style="margin:14px auto 0;">↺ Try Again</button>
</div>

<!-- RESULTS -->
<div id="results"></div>

<button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<button id="scrollBottom" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">↓</button>
<div id="toast"></div>

<script>
// ── Config ───────────────────────────────────────────────
const CACHE_RAW = 'https://raw.githubusercontent.com/BlazeFTL/My-Filters/refs/heads/master/disc_17361_cache.json';

let allItems = [];
let currentFilter = 'all';
let currentQuery = '';

// ── Format age from timestamp ────────────────────────────
function formatAge(ts) {
  const mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 2) return 'Just updated';
  if (mins < 60) return `Updated ${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `Updated ${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `Updated ${days}d ago`;
}

// ── Load remote cache ────────────────────────────────────
async function loadRemoteCache() {
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('progressFill').style.width = '30%';
  document.getElementById('progressLabel').textContent = 'Fetching data…';
  document.getElementById('errorPanel').style.display = 'none';
  try {
    const r = await fetch(CACHE_RAW + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    document.getElementById('progressFill').style.width = '80%';
    document.getElementById('progressLabel').textContent = 'Processing…';
    const j = await r.json();
    if (!j || !j.items || !j.items.length) throw new Error('Cache is empty');
    document.getElementById('progressFill').style.width = '100%';
    return j;
  } catch(e) {
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('errorPanel').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Failed to load: ' + e.message;
    throw e;
  }
}

window.reloadCache = async function() {
  document.getElementById('reloadBtn').classList.remove('show');
  document.getElementById('cacheAge').classList.remove('show');
  try {
    const data = await loadRemoteCache();
    loadFromData(data);
    toast('Reloaded ✓', 'ok');
  } catch(e) {
    toast('Reload failed', 'err');
  }
};

// ── Load data into UI ────────────────────────────────────
function loadFromData(data) {
  allItems = data.items;
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('filterRow').classList.add('show');
  document.getElementById('searchInput').disabled = false;
  document.getElementById('reloadBtn').classList.add('show');
  const comments = allItems.filter(i => !i.isReply).length;
  const replies = allItems.filter(i => i.isReply).length;
  document.getElementById('barStats').innerHTML = `${comments} ✉ · ${replies} ↩`;
  if (data.ts) {
    const ageEl = document.getElementById('cacheAge');
    ageEl.textContent = formatAge(data.ts);
    ageEl.classList.add('show');
  }
  renderResults(allItems, '', true);
}

// ── Search & Filter ──────────────────────────────────────
window.onSearchInput = function() {
  currentQuery = document.getElementById('searchInput').value.trim();
  document.getElementById('searchClear').classList.toggle('show', currentQuery.length > 0);
  applyFilterAndSearch();
};

window.clearSearch = function() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  currentQuery = '';
  applyFilterAndSearch();
  document.getElementById('searchInput').focus();
};

window.setFilter = function(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilterAndSearch();
};

function itemMatchesFilter(item, filter) {
  if (filter === 'blazeftl') return item.author.toLowerCase() === 'blazeftl';
  if (filter === 'code') return item.body.includes('```') || item.body.includes('##+js') || item.body.includes('||') || item.body.includes('##');
  if (filter === 'replies') return item.isReply;
  if (filter === 'comments') return !item.isReply;
  return true;
}

function itemMatchesQuery(item, q) {
  if (!q) return true;
  return item.body.toLowerCase().includes(q) || item.author.toLowerCase().includes(q);
}

function applyFilterAndSearch() {
  const q = currentQuery.toLowerCase();
  const filter = currentFilter;

  const allGroups = buildGroups(allItems);

  let matchedGroups;

  if (!q && filter === 'all') {
    matchedGroups = allGroups;
  } else if (q) {
    // THREAD-LEVEL SEARCH: show entire thread if ANY item in thread matches query
    matchedGroups = allGroups.filter(group => {
      const threadItems = [];
      if (group.parent) threadItems.push(group.parent);
      threadItems.push(...group.replies);

      // Apply filter if set
      const filterPass = filter === 'all'
        ? true
        : threadItems.some(i => itemMatchesFilter(i, filter));

      if (!filterPass) return false;

      // Search across all items in thread
      return threadItems.some(i => itemMatchesQuery(i, q));
    });
  } else {
    // Filter only (no search query)
    matchedGroups = allGroups.filter(group => {
      const threadItems = [];
      if (group.parent) threadItems.push(group.parent);
      threadItems.push(...group.replies);
      return threadItems.some(i => itemMatchesFilter(i, filter));
    });
  }

  const countEl = document.getElementById('resultCount');
  countEl.textContent = (q || filter !== 'all')
    ? (matchedGroups.length + ' thread' + (matchedGroups.length !== 1 ? 's' : '')) : '';

  renderResultsFromGroups(matchedGroups, q, false);
}

// ── Render ───────────────────────────────────────────────
const PAGE_SIZE = 50;
let renderedGroups = [];
let renderedCount = 0;
let _pendingScrollBottom = false;

function buildGroups(items) {
  const parentMap = new Map();
  const replyMap = new Map();
  const standalone = [];
  for (const item of items) { if (!item.isReply) parentMap.set(item.id, item); }
  for (const [id] of parentMap) replyMap.set(id, []);
  for (const item of items) {
    if (item.isReply) {
      if (replyMap.has(item.parentId)) replyMap.get(item.parentId).push(item);
      else standalone.push(item);
    }
  }
  const groups = [];
  for (const [id, parent] of parentMap) groups.push({ parent, replies: replyMap.get(id) || [] });
  for (const item of standalone) groups.push({ parent: null, replies: [item] });
  return groups;
}

function renderResults(items, query, scrollToBottom) {
  const groups = buildGroups(items);
  renderResultsFromGroups(groups, query, scrollToBottom);
}

function renderResultsFromGroups(groups, query, scrollToBottom) {
  const container = document.getElementById('results');
  renderedCount = 0;
  _pendingScrollBottom = !!scrollToBottom;
  if (!groups.length) {
    container.innerHTML = '<div class="no-results">No results found.</div>';
    return;
  }
  container.innerHTML = '';
  renderedGroups = groups;
  renderBatch(query, container);
}

function renderBatch(query, container) {
  if (_pendingScrollBottom) {
    const frag = document.createDocumentFragment();
    for (let i = renderedCount; i < renderedGroups.length; i++) {
      frag.appendChild(buildGroupEl(renderedGroups[i], query));
    }
    renderedCount = renderedGroups.length;
    container.appendChild(frag);
    _pendingScrollBottom = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }));
    return;
  }
  const end = Math.min(renderedCount + PAGE_SIZE, renderedGroups.length);
  const frag = document.createDocumentFragment();
  for (let i = renderedCount; i < end; i++) frag.appendChild(buildGroupEl(renderedGroups[i], query));
  renderedCount = end;
  container.appendChild(frag);
  if (renderedCount < renderedGroups.length) {
    const sentinel = document.createElement('div');
    sentinel.style.height = '1px';
    container.appendChild(sentinel);
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        obs.disconnect(); sentinel.remove();
        renderBatch(query, container);
      }
    }, { rootMargin: '400px' });
    obs.observe(sentinel);
  }
}

function buildGroupEl(group, query) {
  if (group.parent) {
    const wrap = document.createElement('div');
    wrap.className = 'thread-group';
    wrap.appendChild(buildCard(group.parent, query, false));
    for (const r of group.replies) wrap.appendChild(buildCard(r, query, true));
    return wrap;
  }
  return buildCard(group.replies[0], query, true);
}

function buildCard(item, query, asReply) {
  const div = document.createElement('div');
  div.className = 'result-card' + (asReply ? ' is-reply' : '');
  const isBlaze = item.author.toLowerCase() === 'blazeftl';
  const date = item.createdAt
    ? new Date(item.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
    : '';
  div.innerHTML = `
    <div class="card-header">
      <div class="avatar"><img src="${escH(item.avatarUrl)}" loading="lazy" onerror="this.style.display='none'"></div>
      <span class="author ${isBlaze ? 'blaze' : ''}">${escH(item.author)}</span>
      <div class="card-badges">
        ${item.isReply ? '<span class="badge badge-reply">Reply</span>' : ''}
        ${isBlaze ? '<span class="badge badge-blaze">BlazeFTL</span>' : ''}
      </div>
      <span class="card-date">${date}</span>
    </div>
    <div class="card-body">${renderMarkdown(item.body, query)}</div>
    <div class="card-footer">
      <a class="card-link" href="${escH(item.url)}" target="_blank">↗ View on GitHub</a>
    </div>`;
  return div;
}

function renderMarkdown(raw, query) {
  let text = raw;
  text = text.replace(/^>\s*\[!(TIP|NOTE|WARNING|IMPORTANT|CAUTION)\]\s*\n((?:>.*\n?)*)/gim,
    (_, type, body) => {
      const cls = type.toLowerCase();
      const inner = body.replace(/^>\s?/gm, '').trim();
      const icons = { tip:'💡', note:'ℹ️', warning:'⚠️', important:'🔔', caution:'🔴' };
      return `<div class="gh-alert gh-alert-${cls}"><div class="gh-alert-title">${icons[cls]||''} ${type}</div>${marked.parse(inner)}</div>\n`;
    });
  let html;
  try { html = marked.parse(text, { breaks:true, gfm:true }); }
  catch(e) { html = escH(raw).replace(/\n/g,'<br>'); }
  if (query) {
    try {
      const esc = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      html = html.replace(new RegExp(`(?![^<]*>)(${esc})`,'gi'),'<mark>$1</mark>');
    } catch(e) {}
  }
  return html;
}

function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className='', 3000);
}

window.addEventListener('scroll', () => {
  const atTop = window.scrollY < 400;
  const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 400;
  document.getElementById('scrollTop').classList.toggle('show', !atTop);
  document.getElementById('scrollBottom').classList.toggle('show', !atBottom && window.scrollY > 100);
});

// ── Init: always load from remote cache ──────────────────
(async function init() {
  try {
    const data = await loadRemoteCache();
    loadFromData(data);
    toast('Loaded ✓', 'ok');
  } catch(e) {
    // error panel already shown by loadRemoteCache
  }
})();
</script>
