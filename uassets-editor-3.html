<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>uAssets Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root {
  --bg:#ffffff; --bg2:#f7f8fa; --bg3:#eef0f3; --surface:#ffffff;
  --primary:#1565c0; --primary-lt:#e3edf9; --primary-mid:#1976d2;
  --accent:#00897b; --warn:#e65100; --ok:#2e7d32; --err:#c62828;
  --text:#1a1c1e; --text2:#444750; --text3:#80858f;
  --border:#dde1e7; --border2:#c5cad3;
  --shadow:0 2px 8px rgba(0,0,0,.10); --shadow2:0 4px 20px rgba(0,0,0,.13);
  --r:10px; --r-sm:6px;
  --topbar:52px; --tabbar:40px; --toolbar:44px; --statusbar:26px;
  --sw:268px; --tr:0.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg2);color:var(--text);display:flex;flex-direction:column}

/* TOPBAR */
#topbar{height:var(--topbar);min-height:var(--topbar);background:var(--primary);display:flex;align-items:center;gap:4px;padding:0 8px;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.22);flex-shrink:0}
.tlogo{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
#pat-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap;border:none;color:#fff;background:rgba(255,255,255,0.1)}
#pat-badge.ok{background:rgba(80,200,120,.25);color:#c8e6c9}
.sp{flex:1}
.tbtn{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:var(--r-sm);border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:var(--tr);flex-shrink:0}
.tbtn:hover{background:rgba(255,255,255,.24)}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden;position:relative}
#ov{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity var(--tr)}
#ov.show{opacity:1;pointer-events:all}

/* SIDEBAR */
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:160;flex-shrink:0;transition:transform var(--tr)}
@media(max-width:700px){#sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow2)}#sidebar.open{transform:translateX(0)}}
@media(min-width:701px){#sidebar.collapsed{transform:translateX(calc(-1 * var(--sw)));min-width:0;width:0;border:none}}

.sb-head{height:var(--topbar);min-height:var(--topbar);display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.sb-head-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;flex:1}
.sb-fi-wrap{padding:8px 10px 4px;flex-shrink:0}
.sb-fi-wrap input{width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--bg2);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}

#file-list{flex:1;overflow-y:auto}
.file-item{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;font-size:13.5px;color:var(--text2);border-left:3px solid transparent}
.file-item.active{background:var(--primary-lt);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.fi-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}
.file-item.modified .fi-dot{display:block}

/* EDITOR AREA */
#editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* SEARCH PANEL (TOP) */
#sp {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height .25s ease, opacity .18s;
  z-index: 100;
}
#sp.open { max-height: 120px; opacity: 1; }
#sp-in { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

/* SEARCH RESULTS OVERLAY (FULL PAGE) */
#sp-res-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg2);
  z-index: 90;
  display: none;
  flex-direction: column;
}
#sp-res-overlay.show { display: flex; }
#sp-res-list { flex: 1; overflow-y: auto; padding-bottom: 40px; }

/* TABS & TOOLBAR */
#tabbar{height:var(--tabbar);display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:120px;border-right:1px solid var(--border);cursor:pointer;font-size:12.5px;position:relative;background: rgba(0,0,0,0.03)}
.tab.active{background:var(--surface);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--primary)}
.tab-x:hover{color:var(--err)}

#etbar{height:var(--toolbar);display:flex;align-items:center;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.etbtn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--r-sm);border:none;background:transparent;cursor:pointer;font-weight:600;font-size:12.5px}
.etbtn.save{background:var(--accent);color:#fff}
.etbtn.save:disabled{opacity:0.5;background:var(--text3)}

/* EDITOR */
#editor-body{flex:1;display:flex;overflow:hidden;position:relative}
#code-ta{flex:1;border:none;outline:none;padding:14px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;resize:none;white-space:pre;overflow:auto}

/* MODALS & OTHERS */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal-card{background:#fff;padding:24px;border-radius:var(--r);width:100%;max-width:400px}

#statusbar{height:var(--statusbar);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 12px;font-size:11px}
.rg-row{padding:8px 15px;border-bottom:1px solid var(--border);cursor:pointer;font-family:monospace;font-size:12px}
.rg-row:hover{background:var(--primary-lt)}
.rg-fhdr{padding:10px;background:var(--bg3);font-weight:bold;position:sticky;top:0}
</style>
</head>
<body>

<div id="topbar">
  <button class="tbtn" onclick="toggleSidebar()"><span class="mi material-icons-round">menu</span></button>
  <div class="tlogo"><span>uAssets Editor</span></div>
  <button id="pat-badge" onclick="openPATModal()"><span id="pat-txt">No PAT</span></button>
  <div class="sp"></div>
  <button class="tbtn" id="top-goto" style="display:none" onclick="openGotoLine()"><span class="mi material-icons-round">format_list_numbered</span></button>
  <button class="tbtn" onclick="toggleSearch()"><span class="mi material-icons-round">search</span></button>
</div>

<div id="layout">
  <div id="ov" onclick="closeSbMobile()"></div>
  
  <div id="sidebar">
    <div class="sb-head"><span class="sb-head-title">Filters</span><span id="fcbadge">0</span></div>
    <div class="sb-fi-wrap"><input id="sb-fi" placeholder="Search files..." oninput="filterSb(this.value)"></div>
    <div id="file-list"></div>
    <div style="padding:8px"><button class="etbtn" style="width:100%;background:var(--primary-lt)" onclick="loadFileList()">Load Files</button></div>
  </div>

  <div id="editor-area">
    <div id="sp">
      <div id="sp-in">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="display:flex;background:var(--bg3);border-radius:4px;padding:2px">
            <button class="etbtn" id="sm-f" onclick="setMode('file')">Current File</button>
            <button class="etbtn" id="sm-a" onclick="setMode('all')">All Files</button>
          </div>
          <input id="sp-si" placeholder="Search text..." style="flex:1;padding:6px;border:1px solid var(--border);border-radius:4px" oninput="onSI()">
          <button class="tbtn" style="color:var(--text);background:none" onclick="toggleSearch()"><span class="mi material-icons-round">close</span></button>
        </div>
      </div>
    </div>

    <div id="tabbar"></div>
    <div id="etbar">
      <span id="fbread" style="font-size:12px;color:var(--text3)">No file selected</span>
      <div class="sp"></div>
      <button class="etbtn save" id="tb-save" onclick="saveFile()" disabled><span class="mi material-icons-round">save</span> Save</button>
    </div>

    <div id="editor-body">
      <textarea id="code-ta" spellcheck="false" wrap="off"></textarea>
      
      <div id="sp-res-overlay">
        <div style="padding:10px;background:var(--primary);color:#fff;display:flex;justify-content:space-between">
          <span id="sp-res-stat">Search Results</span>
          <span class="mi material-icons-round" style="cursor:pointer" onclick="closeAllSearch()">close</span>
        </div>
        <div id="sp-res-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="sb-pos">Ln 1, Col 1</span>
  <div class="sp"></div>
  <span id="sb-status">Ready</span>
</div>

<div class="modal-bg" id="pat-modal">
  <div class="modal-card">
    <h3>GitHub Token</h3>
    <input class="modal-inp" type="password" id="pat-inp" style="width:100%;padding:10px;margin:15px 0" placeholder="ghp_xxx">
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="etbtn" onclick="closePATModal()">Cancel</button>
      <button class="etbtn save" onclick="confirmPAT()">Verify</button>
    </div>
  </div>
</div>

<script>
const OWNER='uBlockOrigin', REPO='uAssets', BRANCH='master', BASE='filters';
let PAT='', allFiles=[], cache={}, tabs=[], active=null, dirty={}, sMode='file', indexed=false;

const G=id=>document.getElementById(id);

async function loadFileList() {
    G('file-list').innerHTML = '<div style="padding:20px;text-align:center">Fetching...</div>';
    try {
        const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`, PAT ? {headers:{'Authorization':`Bearer ${PAT}`}} : {});
        const d = await r.json();
        allFiles = d.tree.filter(f => f.path.startsWith(BASE+'/') && f.path.endsWith('.txt')).map(f=>({name:f.path.split('/').pop(), path:f.path, sha:f.sha}));
        G('fcbadge').textContent = allFiles.length;
        renderSb(allFiles);
    } catch(e) { alert("Rate limit or error: " + e.message); }
}

function renderSb(files) {
    G('file-list').innerHTML = files.map(f => `
        <div class="file-item ${active===f.path?'active':''} ${dirty[f.path]?'modified':''}" onclick="openFile('${f.path}')">
            <span class="fi-name">${f.name}</span>
            <span class="fi-dot"></span>
        </div>`).join('');
}

async function openFile(path) {
    if(active && cache[active]) cache[active].content = G('code-ta').value;
    if(!tabs.includes(path)) tabs.push(path);
    active = path;
    
    // Show/Hide Goto Line based on file extension
    G('top-goto').style.display = path.endsWith('.txt') ? 'flex' : 'none';

    if(cache[path]) {
        display(path);
    } else {
        G('sb-status').textContent = "Downloading...";
        const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, PAT ? {headers:{'Authorization':`Bearer ${PAT}`}} : {});
        const d = await r.json();
        const content = atob(d.content.replace(/\n/g,''));
        cache[path] = {content, sha:d.sha, original:content};
        display(path);
    }
    renderTabs();
    renderSb(allFiles);
}

function display(path) {
    G('code-ta').value = cache[path].content;
    G('fbread').textContent = path;
    G('tb-save').disabled = !PAT;
    G('sb-status').textContent = "Ready";
}

function renderTabs() {
    G('tabbar').innerHTML = tabs.map(p => `
        <div class="tab ${p===active?'active':''}" onclick="openFile('${p}')">
            <span>${p.split('/').pop()}</span>
            <span class="tab-x material-icons-round" style="font-size:14px" onclick="closeTab(event,'${p}')">close</span>
        </div>`).join('');
}

function closeTab(e, path) {
    e.stopPropagation();
    // Discard logic: remove from cache and dirty tracking
    delete dirty[path];
    delete cache[path];
    tabs = tabs.filter(t => t !== path);
    if(active === path) {
        active = tabs[0] || null;
        if(active) openFile(active);
        else {
            G('code-ta').value = '';
            G('fbread').textContent = 'No file open';
            G('top-goto').style.display = 'none';
        }
    }
    renderTabs();
    renderSb(allFiles);
}

function toggleSearch() {
    const sp = G('sp');
    sp.classList.toggle('open');
    if(!sp.classList.contains('open')) closeAllSearch();
    else G('sp-si').focus();
}

function setMode(m) {
    sMode = m;
    G('sm-f').style.background = m==='file'?'#fff':'none';
    G('sm-a').style.background = m==='all'?'#fff':'none';
    if(m === 'file') closeAllSearch();
}

async function buildIndex() {
    if(indexed) return;
    G('sb-status').textContent = "Indexing all files (Caching)...";
    const BATCH_SIZE = 5;
    for(let i=0; i<allFiles.length; i+=BATCH_SIZE) {
        const batch = allFiles.slice(i, i+BATCH_SIZE);
        await Promise.all(batch.map(async f => {
            if(!cache[f.path]) {
                try {
                    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${f.path}`, PAT ? {headers:{'Authorization':`Bearer ${PAT}`}} : {});
                    const d = await r.json();
                    const content = atob(d.content.replace(/\n/g,''));
                    cache[f.path] = {content, sha:f.sha, original:content};
                } catch(e) {}
            }
        }));
        G('sb-status').textContent = `Indexing: ${i+batch.length}/${allFiles.length}`;
    }
    indexed = true;
    G('sb-status').textContent = "Indexing Complete";
}

async function onSI() {
    const q = G('sp-si').value.toLowerCase();
    if(!q) return closeAllSearch();
    
    if(sMode === 'all') {
        G('sp-res-overlay').classList.add('show');
        if(!indexed) await buildIndex();
        
        let results = '';
        let total = 0;
        for(const path in cache) {
            const lines = cache[path].content.split('\n');
            const matches = lines.map((l,i) => l.toLowerCase().includes(q) ? {l, i:i+1} : null).filter(x=>x);
            if(matches.length > 0) {
                total += matches.length;
                results += `<div class="rg-fhdr">${path.split('/').pop()}</div>`;
                results += matches.slice(0,10).map(m => `
                    <div class="rg-row" onclick="jumpTo('${path}', ${m.i})">
                        <b style="color:var(--text3)">${m.i}:</b> ${m.l.replace(new RegExp(q, 'gi'), s => `<mark>${s}</mark>`)}
                    </div>`).join('');
            }
        }
        G('sp-res-stat').textContent = `Found ${total} matches`;
        G('sp-res-list').innerHTML = results || '<div style="padding:20px">No results found.</div>';
    }
}

function jumpTo(path, line) {
    closeAllSearch();
    openFile(path).then(() => {
        const ta = G('code-ta');
        const lines = ta.value.split('\n');
        let pos = 0;
        for(let i=0; i<line-1; i++) pos += lines[i].length + 1;
        ta.focus();
        ta.setSelectionRange(pos, pos + lines[line-1].length);
    });
}

function closeAllSearch() {
    G('sp-res-overlay').classList.remove('show');
}

function openGotoLine() {
    const ln = prompt("Go to line:");
    if(ln) jumpTo(active, parseInt(ln));
}

// PAT logic
function openPATModal() { G('pat-modal').classList.add('open'); }
function closePATModal() { G('pat-modal').classList.remove('open'); }
async function confirmPAT() {
    PAT = G('pat-inp').value;
    G('pat-txt').textContent = "Verifying...";
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {headers:{'Authorization':`Bearer ${PAT}`}});
    if(r.ok) {
        G('pat-badge').className = 'ok';
        G('pat-txt').textContent = "PAT Active";
        closePATModal();
        loadFileList();
    } else {
        alert("Invalid PAT");
        G('pat-txt').textContent = "No PAT";
    }
}

// Editor tracking
G('code-ta').oninput = () => {
    if(!active) return;
    dirty[active] = G('code-ta').value !== cache[active].original;
    renderSb(allFiles);
};

</script>
</body>
</html>
