<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Editor - BlazeFTL</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1e1e1e;
            color: #ffffff;
        }
        header {
            padding: 10px 20px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #editor {
            flex-grow: 1;
            overflow: hidden;
        }
        .cm-editor {
            height: 100%;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; }
        input {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            border-radius: 4px;
        }
        .status { font-size: 12px; margin-right: 10px; }
    </style>
</head>
<body>

<header>
    <div><strong>My-Filters Editor</strong> (Static Sites)</div>
    <div class="controls">
        <span id="status" class="status">Ready</span>
        <input type="password" id="token" placeholder="GitHub Personal Access Token">
        <button id="saveBtn">Save Changes</button>
    </div>
</header>

<div id="editor"></div>

<script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
    import { StreamLanguage } from "https://esm.sh/@codemirror/language@6.0.0";
    import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.0.0";

    const GITHUB_CONFIG = {
        owner: 'BlazeFTL',
        repo: 'My-Filters',
        path: 'My-Filters_Static_Sites.txt',
        branch: 'master'
    };

    let editor;
    let fileSha = null;

    // Initialize CodeMirror 6
    async function initEditor(content) {
        editor = new EditorView({
            doc: content,
            extensions: [
                basicSetup,
                oneDark,
                EditorView.lineWrapping
            ],
            parent: document.getElementById("editor")
        });
    }

    // Fetch File Content from GitHub
    async function fetchFile() {
        const status = document.getElementById('status');
        status.textContent = "Loading...";
        
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`;
            const response = await fetch(url);
            const data = await response.json();
            
            fileSha = data.sha;
            const content = atob(data.content); // Decode base64
            
            initEditor(content);
            status.textContent = "File Loaded";
        } catch (error) {
            status.textContent = "Error loading file";
            console.error(error);
        }
    }

    // Save File Content to GitHub
    async function saveFile() {
        const token = document.getElementById('token').value;
        const status = document.getElementById('status');
        
        if (!token) {
            alert("Please enter a GitHub Personal Access Token to save.");
            return;
        }

        status.textContent = "Saving...";
        const newContent = editor.state.doc.toString();
        
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update filters via Web Editor",
                    content: btoa(unescape(encodeURIComponent(newContent))), // Handle UTF-8 to Base64
                    sha: fileSha,
                    branch: GITHUB_CONFIG.branch
                })
            });

            if (response.ok) {
                const data = await response.json();
                fileSha = data.content.sha;
                status.textContent = "Saved Successfully!";
            } else {
                const errData = await response.json();
                status.textContent = "Save Failed: " + errData.message;
            }
        } catch (error) {
            status.textContent = "Error saving";
            console.error(error);
        }
    }

    document.getElementById('saveBtn').addEventListener('click', saveFile);
    
    // Start
    fetchFile();
</script>

</body>
</html>
