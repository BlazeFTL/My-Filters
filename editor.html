<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Filter Editor — BlazeFTL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F5F5F5;
  --border:#E0E0E0; --border2:#BDBDBD;
  --primary:#1565C0; --primary-light:#E3F2FD;
  --text:#212121; --text2:#757575; --text3:#BDBDBD;
  --shadow:0 1px 3px rgba(0,0,0,.14); --shadow2:0 2px 8px rgba(0,0,0,.18);
  --fn:13px; --lh:21px;
  --c-comment:#6A737D; --c-title:#005CC5; --c-except:#B31D28;
  --c-network:#005CC5; --c-cosmetic:#22863A; --c-scriptlet:#6F42C1;
  --c-domain:#E36209; --c-option:#032F62; --c-plain:#24292E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;display:flex;flex-direction:column}

#topBar{flex-shrink:0;background:var(--primary);color:#fff;padding:0 10px 0 14px;height:52px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow2);z-index:100;gap:8px}
.app-info{flex:1;min-width:0}
.app-title{font-size:16px;font-weight:500}
.app-file{font-size:10px;opacity:.7;font-family:'Roboto Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#statusChip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border-radius:12px;padding:4px 10px;font-size:11px;white-space:nowrap}
#sDot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s}
#sDot.ok{background:#69F0AE}#sDot.err{background:#FF5252}#sDot.loading{background:#FFD740;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#patTopBtn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-family:'Roboto',sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
#patTopBtn:active{opacity:.7}
#patDot{width:10px;height:10px;border-radius:50%;background:#FF5252;flex-shrink:0;transition:background .3s}
#patDot.set{background:#69F0AE}

#toolbar{flex-shrink:0;background:var(--surface);border-bottom:2px solid var(--border);padding:5px 8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.btn{font-family:'Roboto',sans-serif;font-size:12px;font-weight:500;padding:6px 10px;border-radius:4px;border:none;cursor:pointer;white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;transition:background .12s;min-height:32px;display:inline-flex;align-items:center;gap:4px}
.btn:active{opacity:.75;transform:scale(.96)}
.btn-flat{background:transparent;color:var(--primary)}.btn-flat:hover{background:var(--primary-light)}
.btn-raised{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.btn-green{background:#388E3C;color:#fff;box-shadow:var(--shadow)}
.btn:disabled{opacity:.3;pointer-events:none}
#modBadge{display:none;font-size:10px;font-weight:700;background:#FF8F00;color:#fff;border-radius:10px;padding:2px 8px;letter-spacing:.5px}
#modBadge.show{display:inline-block}

#findBar{flex-shrink:0;background:#EFF6FF;border-bottom:1px solid #BBDEFB;padding:6px 8px;display:none;flex-direction:column;gap:5px}
#findBar.show{display:flex}
.find-row{display:flex;gap:5px;align-items:center}
.find-input{flex:1;min-width:0;font-family:'Roboto Mono',monospace;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:4px;background:#fff;color:var(--text);outline:none}
.find-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
#findCount{font-size:11px;color:var(--text2);white-space:nowrap;min-width:60px;text-align:center}
#regexToggle{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:700;padding:5px 10px;border:1px solid var(--border2);border-radius:4px;background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;user-select:none;transition:all .15s}
#regexToggle.active{background:var(--primary);color:#fff;border-color:var(--primary)}

#editorArea{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
#loadingOverlay{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;z-index:10}

/* CodeMirror 6 */
.cm-editor{height:100%;font-family:'Roboto Mono',monospace;font-size:var(--fn);line-height:var(--lh)}
.cm-editor.cm-focused{outline:none}
.cm-scroller{overflow:auto;-webkit-overflow-scrolling:touch}

#commitBar{display:none;position:fixed;left:0;right:0;background:var(--surface);border-top:2px solid #388E3C;padding:10px;gap:8px;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.12);z-index:150}
#commitBar.show{display:flex}
#commitMsg{flex:1;font-family:'Roboto',sans-serif;font-size:15px;padding:12px 14px;border:1px solid var(--border2);border-radius:6px;outline:none;color:var(--text);background:var(--surface);min-height:48px}
#commitMsg:focus{border-color:#388E3C;box-shadow:0 0 0 2px #C8E6C9}

#patModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
#patModal.show{display:flex}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;padding:22px 20px 36px;width:100%;max-width:520px}
.modal-sheet h2{font-size:16px;font-weight:500;margin-bottom:6px}
.modal-sheet p{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.modal-sheet input{width:100%;font-family:'Roboto Mono',monospace;font-size:13px;padding:10px 12px;border:1px solid var(--border2);border-radius:4px;outline:none;margin-bottom:14px;background:var(--surface2);color:var(--text)}
.modal-sheet input:focus{border-color:var(--primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(64px);background:#323232;color:#fff;border-radius:4px;padding:10px 18px;font-size:13px;font-weight:500;transition:transform .22s ease;z-index:400;white-space:nowrap;box-shadow:var(--shadow2);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="topBar">
  <div class="app-info">
    <div class="app-title">Filter Editor</div>
    <div class="app-file">My-Filters_Static_Sites.txt</div>
  </div>
  <div class="top-right">
    <div id="statusChip"><div id="sDot"></div><span id="sText">Not loaded</span></div>
    <button id="patTopBtn" onclick="showPat()"><div id="patDot"></div> PAT</button>
  </div>
</div>

<div id="toolbar">
  <button class="btn btn-raised" onclick="loadFile()">⬇ Load</button>
  <button class="btn btn-green" id="saveBtn" onclick="showCommit()" disabled>⬆ Save</button>
  <button class="btn btn-flat" onclick="toggleFind()">🔍 Find</button>
  <button class="btn btn-flat" onclick="pasteToEditor()">📋 Paste</button>
  <button class="btn btn-flat" onclick="copySelection()">⎘ Copy</button>
  <button class="btn btn-flat" onclick="goToLine()"># Line</button>
  <button class="btn btn-flat" id="wrapBtn" onclick="toggleWrap()">⇥ Wrap: OFF</button>
  <span id="modBadge">UNSAVED</span>
</div>

<div id="findBar">
  <div class="find-row">
    <input class="find-input" id="findInput" placeholder="Find..." oninput="doFind()" />
    <span id="regexToggle" onclick="toggleRegex()">.*</span>
    <span id="findCount"></span>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="navFind(-1)">▲</button>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="navFind(1)">▼</button>
    <button class="btn btn-flat" style="padding:6px 8px" onclick="toggleFind()">✕</button>
  </div>
  <div class="find-row">
    <input class="find-input" id="replaceInput" placeholder="Replace with..." />
    <button class="btn btn-flat" onclick="replaceCurrent()">Replace</button>
    <button class="btn btn-flat" onclick="replaceAll()">All</button>
  </div>
</div>

<div id="editorArea">
  <div id="loadingOverlay">Loading editor…</div>
</div>

<div id="commitBar">
  <input id="commitMsg" type="text" placeholder="Commit message..." value="Update My-Filters" />
  <button class="btn btn-green" style="min-height:48px;font-size:14px;padding:10px 16px" onclick="saveFile()">✔ Commit</button>
  <button class="btn btn-flat" style="min-height:48px;font-size:13px;color:#C62828" onclick="hideCommit()">Cancel ✕</button>
</div>

<div id="patModal">
  <div class="modal-sheet">
    <h2>GitHub Token (PAT)</h2>
    <p>Required for saving only. Needs <b>repo</b> scope.<br>Stored in your browser only.</p>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    <div class="modal-actions">
      <button class="btn btn-flat" onclick="closePat()">Cancel</button>
      <button class="btn btn-raised" onclick="savePat()">Save Token</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "codemirror":            "https://esm.sh/codemirror@6.0.1",
    "@codemirror/state":     "https://esm.sh/@codemirror/state@6.4.1",
    "@codemirror/view":      "https://esm.sh/@codemirror/view@6.35.3",
    "@codemirror/language":  "https://esm.sh/@codemirror/language@6.10.8",
    "@codemirror/commands":  "https://esm.sh/@codemirror/commands@6.7.1",
    "@codemirror/search":    "https://esm.sh/@codemirror/search@6.5.10",
    "@lezer/highlight":      "https://esm.sh/@lezer/highlight@1.2.1"
  }
}
</script>


<script type="module">
import { EditorView, keymap, lineNumbers, highlightActiveLine,
         highlightActiveLineGutter, drawSelection, Decoration }
  from '@codemirror/view';
import { EditorState, Compartment, StateEffect, StateField,
         RangeSetBuilder }
  from '@codemirror/state';
import { defaultKeymap, history, historyKeymap, indentWithTab }
  from '@codemirror/commands';
import { syntaxHighlighting, HighlightStyle, StreamLanguage }
  from '@codemirror/language';
import { tags } from '@lezer/highlight';

// ── CONFIG ────────────────────────────────────────────
const OWNER = 'BlazeFTL', REPO = 'My-Filters';
const FILE  = 'My-Filters_Static_Sites.txt';
const RAW   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/master/${FILE}`;
const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
let fileSha = null, originalContent = '';

// ── BLAZE FILTER LANGUAGE ─────────────────────────────
const blazeLang = StreamLanguage.define({
  name: 'blazeFilter',
  startState: () => ({}),
  token(stream) {
    if (!stream.sol()) { stream.skipToEnd(); return 'content'; }
    const line = stream.string;

    // Comments & titles
    if (/^[!#]/.test(line)) {
      stream.skipToEnd();
      if (/^!\s*(Title|Version|Last modified|Expires|Description|License|Homepage|Forums):/i.test(line))
        return 'keyword';
      return 'comment';
    }

    // Exception @@
    if (line.startsWith('@@')) {
      stream.skipToEnd();
      return 'special(name)';
    }

    // Scriptlet rules ###+js( / ##+js( / #+js(
    const scriptletSep = line.match(/(#[@+]?#\+js\(|#\+js\()/);
    if (scriptletSep) {
      const si = line.indexOf(scriptletSep[0]);
      if (stream.pos < si)            { stream.pos = si; return 'string'; }
      if (stream.match(scriptletSep[0])) return 'operator';
      stream.skipToEnd(); return 'name';
    }

    // Extended cosmetic ##^
    if (/^.+##\^/.test(line)) {
      const si = line.indexOf('##^');
      if (stream.pos < si) { stream.pos = si; return 'string'; }
      if (stream.match('##^')) return 'operator';
      stream.skipToEnd(); return 'operator';
    }

    // Cosmetic ## / #@#
    if (/^.+#@?#/.test(line)) {
      const sep = line.includes('#@#') ? '#@#' : '##';
      const si = line.indexOf(sep);
      if (stream.pos < si) { stream.pos = si; return 'string'; }
      if (stream.match(sep)) return 'operator';
      stream.skipToEnd(); return 'operator';
    }

    // Network rule with $options
    if (/^\|\||^\*|^\^/.test(line) || /\$[a-z]/.test(line)) {
      const di = line.lastIndexOf('$');
      if (di > 0 && !/^https?:\/\//.test(line)) {
        if (stream.pos < di) { stream.pos = di; return 'typeName'; }
        stream.skipToEnd(); return 'attributeValue';
      }
      stream.skipToEnd(); return 'typeName';
    }

    stream.skipToEnd(); return 'content';
  },
  blankLine: () => {},
  copyState: s => ({...s}),
  indent: () => 0,
});

const blazeStyle = HighlightStyle.define([
  { tag: tags.comment,                    color:'var(--c-comment)', fontStyle:'italic' },
  { tag: tags.keyword,                    color:'var(--c-title)',   fontWeight:'500'   },
  { tag: tags.special(tags.name),         color:'var(--c-except)'                     },
  { tag: tags.string,                     color:'var(--c-domain)'                     },
  { tag: tags.operator,                   color:'var(--c-cosmetic)'                   },
  { tag: tags.name,                       color:'var(--c-scriptlet)'                  },
  { tag: tags.typeName,                   color:'var(--c-network)'                    },
  { tag: tags.attributeValue,             color:'var(--c-option)'                     },
  { tag: tags.content,                    color:'var(--c-plain)'                      },
]);

// ── FIND DECORATION FIELD ─────────────────────────────
const markDeco    = Decoration.mark({ class: 'cm-find-match'    });
const curDeco     = Decoration.mark({ class: 'cm-find-current'  });
const setFindEff  = StateEffect.define();
const findDecoField = StateField.define({
  create: () => Decoration.none,
  update(v, tr) {
    for (const e of tr.effects) if (e.is(setFindEff)) return e.value;
    return tr.docChanged ? Decoration.none : v;
  },
  provide: f => EditorView.decorations.from(f),
});

function applyFindDecos(matches, curIdx) {
  if (!view) return;
  const b = new RangeSetBuilder();
  for (let i = 0; i < matches.length; i++) {
    const m = matches[i];
    if (m.from < m.to)
      b.add(m.from, m.to, i === curIdx ? curDeco : markDeco);
  }
  view.dispatch({ effects: setFindEff.of(b.finish()) });
}

// ── COMPARTMENTS ──────────────────────────────────────
const wrapComp = new Compartment();

// ── EDITOR ────────────────────────────────────────────
let view = null;

function buildState(doc) {
  return EditorState.create({
    doc,
    extensions: [
      history(),
      lineNumbers(),
      highlightActiveLine(),
      highlightActiveLineGutter(),
      drawSelection(),
      blazeLang,
      syntaxHighlighting(blazeStyle),
      findDecoField,
      wrapComp.of([]),   // wrap off by default
      keymap.of([...defaultKeymap, ...historyKeymap, indentWithTab]),
      EditorView.updateListener.of(u => { if (u.docChanged) onDocChange(); }),
      EditorView.theme({
        '&'                               : { height:'100%', background:'var(--surface)', color:'var(--c-plain)' },
        '.cm-scroller'                    : { fontFamily:"'Roboto Mono',monospace", fontSize:'var(--fn)', lineHeight:'var(--lh)' },
        '.cm-content'                     : { padding:'8px 12px 200px', caretColor:'var(--primary)' },
        '.cm-gutters'                     : { background:'var(--surface2)', borderRight:'1px solid var(--border)', color:'var(--text3)' },
        '.cm-lineNumbers .cm-gutterElement': { padding:'0 6px 0 4px', minWidth:'40px', textAlign:'right' },
        '.cm-activeLine'                  : { background:'rgba(21,101,192,.04)' },
        '.cm-activeLineGutter'            : { background:'rgba(21,101,192,.08)', color:'var(--text2)' },
        '.cm-selectionBackground'         : { background:'rgba(21,101,192,.2)' },
        '&.cm-focused .cm-selectionBackground': { background:'rgba(21,101,192,.28)' },
        '.cm-cursor,.cm-dropCursor'       : { borderLeft:'2px solid var(--primary)' },
        '.cm-find-match'                  : { background:'#FFF176', borderRadius:'2px' },
        '.cm-find-current'               : { background:'#FFD54F', outline:'1px solid #F9A825', borderRadius:'2px' },
      }),
    ],
  });
}

function initEditor(doc) {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.remove();
  
  view = new EditorView({
    state: buildState(doc),
    parent: document.getElementById('editorArea'),
  });
}

// ── DOC CHANGE ────────────────────────────────────────
function onDocChange() {
  const cur = view.state.doc.toString();
  document.getElementById('modBadge').classList.toggle('show', cur !== originalContent);
  if (findOpen) { clearTimeout(findDebounce); findDebounce = setTimeout(doFind, 100); }
}
let findDebounce = null;

// ── LOAD ──────────────────────────────────────────────
async function loadFile(force) {
  const cur = view ? view.state.doc.toString() : '';
  if (!force && cur !== originalContent && cur.trim()) {
    if (!confirm('You have unsaved changes. Discard and reload?')) return;
  }
  setStatus('loading', 'Fetching…');
  try {
    const r = await fetch(RAW + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    if (!view) initEditor(text);
    else view.dispatch({ changes:{ from:0, to:view.state.doc.length, insert:text } });
    originalContent = text;
    const lc = text.split('\n').length;
    setStatus('ok', lc + ' lines');
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('modBadge').classList.remove('show');
    fetchSha();
    toast('Loaded — ' + lc + ' lines');
    requestAnimationFrame(() => {
      const end = view.state.doc.length;
      view.dispatch({ effects: EditorView.scrollIntoView(end, { y:'end' }) });
    });
  } catch(e) {
    setStatus('err', 'Load failed');
    toast('Load failed: ' + e.message);
    if (!view) initEditor('');
  }
}

async function fetchSha() {
  const pat = getPat();
  try {
    const r = await fetch(API, { headers: pat ? { Authorization:'token '+pat } : {} });
    fileSha = (await r.json()).sha;
  } catch(e) {}
}

// ── FIND / REPLACE ────────────────────────────────────
let findMatches = [], findIdx = 0, regexMode = false, findOpen = false;
let findJumpTimer = null;

function toggleFind() {
  findOpen = !findOpen;
  document.getElementById('findBar').classList.toggle('show', findOpen);
  if (findOpen) setTimeout(() => document.getElementById('findInput').focus(), 50);
  else {
    findMatches = [];
    document.getElementById('findCount').textContent = '';
    if (view) view.dispatch({ effects: setFindEff.of(Decoration.none) });
  }
}

function toggleRegex() {
  regexMode = !regexMode;
  document.getElementById('regexToggle').classList.toggle('active', regexMode);
  doFind();
}

function doFind() {
  if (!view) return;
  const q = document.getElementById('findInput').value;
  findMatches = []; findIdx = 0;
  if (!q) {
    document.getElementById('findCount').textContent = '';
    view.dispatch({ effects: setFindEff.of(Decoration.none) });
    return;
  }
  let re;
  try {
    re = regexMode
      ? new RegExp(q, 'gi')
      : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  } catch(e) { document.getElementById('findCount').textContent = 'Bad regex'; return; }

  const text = view.state.doc.toString();
  let m;
  while ((m = re.exec(text)) !== null) {
    findMatches.push({ from: m.index, to: m.index + m[0].length });
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  updateFindCount();
  applyFindDecos(findMatches, findIdx);

  clearTimeout(findJumpTimer);
  if (findMatches.length) {
    findJumpTimer = setTimeout(() => {
      findIdx = 0;
      applyFindDecos(findMatches, 0);
      updateFindCount();
      view.dispatch({ effects: EditorView.scrollIntoView(findMatches[0].from, { y:'center' }) });
    }, 350);
  }
}

function navFind(dir) {
  if (!findMatches.length) return;
  findIdx = (findIdx + dir + findMatches.length) % findMatches.length;
  applyFindDecos(findMatches, findIdx);
  updateFindCount();
  view.dispatch({ effects: EditorView.scrollIntoView(findMatches[findIdx].from, { y:'center' }) });
  setTimeout(() => document.getElementById('findInput').focus(), 10);
}

function updateFindCount() {
  document.getElementById('findCount').textContent =
    findMatches.length ? `${findIdx+1}/${findMatches.length}` : '0 found';
}

function replaceCurrent() {
  if (!view || !findMatches.length) return;
  const rep = document.getElementById('replaceInput').value;
  const m = findMatches[findIdx];
  view.dispatch({ changes:{ from:m.from, to:m.to, insert:rep } });
  doFind(); toast('Replaced 1 match');
}

function replaceAll() {
  if (!view || !findMatches.length) return;
  const rep = document.getElementById('replaceInput').value;
  const n = findMatches.length;
  view.dispatch({ changes: findMatches.map(m => ({ from:m.from, to:m.to, insert:rep })) });
  doFind(); toast(`Replaced ${n} matches`);
}

// ── GO TO LINE ────────────────────────────────────────
function goToLine() {
  const n = prompt('Go to line:');
  if (!n || isNaN(n)) return;
  const ln = Math.max(1, Math.min(parseInt(n), view.state.doc.lines));
  const line = view.state.doc.line(ln);
  view.dispatch({
    selection:{ anchor:line.from, head:line.to },
    effects: EditorView.scrollIntoView(line.from, { y:'center' }),
  });
  view.focus();
}

// ── WRAP ──────────────────────────────────────────────
let wrapOn = false;
function toggleWrap() {
  wrapOn = !wrapOn;
  // CM6 handles line numbers correctly in both wrap and no-wrap modes natively
  view.dispatch({ effects: wrapComp.reconfigure(wrapOn ? EditorView.lineWrapping : []) });
  const btn = document.getElementById('wrapBtn');
  btn.textContent = wrapOn ? '⇥ Wrap: ON' : '⇥ Wrap: OFF';
  btn.style.color  = wrapOn ? '#388E3C' : '';
}

// ── COPY / PASTE ──────────────────────────────────────
function copySelection() {
  if (!view) return;
  const { from, to } = view.state.selection.main;
  if (from === to) { toast('No text selected'); return; }
  const sel = view.state.sliceDoc(from, to);
  navigator.clipboard.writeText(sel)
    .then(() => toast(`Copied ${sel.split('\n').length} line(s)`))
    .catch(() => toast('Copy failed'));
}

async function pasteToEditor() {
  if (!view) return;
  try {
    const text = await navigator.clipboard.readText();
    const { from, to } = view.state.selection.main;
    view.dispatch({ changes:{ from, to, insert:text } });
    toast(`Pasted ${text.split('\n').length} line(s)`);
  } catch(e) { toast('Paste failed — use long-press instead'); }
}

// ── COMMIT BAR ────────────────────────────────────────
function showCommit() {
  if (!getPat()) { showPat(); return; }
  document.getElementById('commitBar').classList.add('show');
  positionCommitBar();
  setTimeout(() => document.getElementById('commitMsg').focus(), 50);
}
function hideCommit() { document.getElementById('commitBar').classList.remove('show'); }
function positionCommitBar() {
  const bar = document.getElementById('commitBar');
  if (!bar.classList.contains('show')) return;
  if (window.visualViewport) {
    const vv = window.visualViewport;
    bar.style.bottom = (window.innerHeight - vv.height - vv.offsetTop) + 'px';
  } else bar.style.bottom = '0px';
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', positionCommitBar);
  window.visualViewport.addEventListener('scroll', positionCommitBar);
}

// ── SAVE ──────────────────────────────────────────────
async function saveFile() {
  const pat = getPat();
  if (!pat)     { toast('No PAT — tap PAT button'); return; }
  if (!fileSha) { toast('Load file first'); return; }
  const msg     = document.getElementById('commitMsg').value || 'Update filters';
  const content = btoa(unescape(encodeURIComponent(view.state.doc.toString())));
  setStatus('loading','Saving…');
  try {
    const r = await fetch(API, {
      method:'PUT',
      headers:{ Authorization:'token '+pat, 'Content-Type':'application/json' },
      body:JSON.stringify({ message:msg, content, sha:fileSha }),
    });
    if (!r.ok) { const j=await r.json(); throw new Error(j.message||r.status); }
    const j = await r.json();
    fileSha = j.content.sha;
    originalContent = view.state.doc.toString();
    document.getElementById('modBadge').classList.remove('show');
    setStatus('ok', view.state.doc.lines + ' lines');
    hideCommit(); toast('Saved to GitHub ✓');
  } catch(e) { setStatus('err','Save failed'); toast('Save failed: '+e.message); }
}

// ── PAT ───────────────────────────────────────────────
function getPat() { return localStorage.getItem('blaze_pat')||''; }
function updatePatIndicator() { document.getElementById('patDot').className = getPat()?'set':''; }
function showPat() {
  document.getElementById('patModal').classList.add('show');
  document.getElementById('patInput').value = getPat();
}
function closePat() { document.getElementById('patModal').classList.remove('show'); }
function savePat() {
  const v = document.getElementById('patInput').value.trim();
  if (v) { localStorage.setItem('blaze_pat',v); toast('Token saved'); }
  else   { localStorage.removeItem('blaze_pat'); toast('Token cleared'); }
  updatePatIndicator(); closePat();
}

// ── STATUS / TOAST ────────────────────────────────────
function setStatus(s,t) { document.getElementById('sDot').className=s; document.getElementById('sText').textContent=t; }
function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── EXPOSE to onclick attributes ──────────────────────
Object.assign(window,{
  loadFile,showCommit,hideCommit,saveFile,
  toggleFind,toggleRegex,doFind,navFind,replaceCurrent,replaceAll,
  goToLine,toggleWrap,copySelection,pasteToEditor,
  showPat,closePat,savePat,
});

// ── BOOT ──────────────────────────────────────────────
updatePatIndicator();
loadFile(true);
</script>
</body>
