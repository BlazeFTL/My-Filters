<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uBlockOrigin | Domain Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #ffffff; color: #1f2328; }
        .wiki-nav { border-bottom: 1px solid #d0d7de; padding: 12px 20px; display: flex; align-items: center; gap: 10px; background: #f6f8fa; }
        .btn-git { background-color: #ffffff; border: 1px solid #d0d7de; border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 0 rgba(27,31,35,0.04); }
        .btn-git:hover { background-color: #f3f4f6; }
        .btn-run { background-color: #1f883d; color: white; border: 1px solid rgba(31,35,40,0.15); border-radius: 6px; padding: 6px 20px; font-weight: 600; font-size: 14px; }
        .btn-run:hover { background-color: #1a7f37; }
        .code-area { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; }
        .badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; text-transform: uppercase; }
        .badge-dead { background: #ffebe9; color: #cf222e; }
        .badge-live { background: #dafbe1; color: #1a7f37; }
        .result-box { border-radius: 6px; border-left: 4px solid; padding: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="wiki-nav">
        <i class="fa-solid fa-bars text-gray-500"></i>
        <span class="font-bold text-[#1a7f37]">uBlockOrigin Filters Domain Checker By BlazeFTL</span>
    </div>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-semibold">Domain Verification Engine</h2>
                <p class="text-sm text-gray-500">Quad-Layer Logic: DNS + Wildcard Trap + HTTP/S Fetch</p>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('fUp').click()" class="btn-git">Upload .txt</button>
                <input type="file" id="fUp" class="hidden" onchange="handleFile(this)">
                <button onclick="runEngine()" id="runBtn" class="btn-run">RUN ANALYSIS</button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-gray-400 uppercase">Input (Paste Link or Text)</label>
                    <span id="inputTypeLabel" class="text-[10px] bg-gray-100 px-2 rounded font-bold text-gray-500">READY</span>
                </div>
                <textarea id="ti" class="w-full h-40 p-3 code-area outline-none focus:ring-1 focus:ring-green-500" placeholder="Paste GitHub raw link, local file content, or uBO filters..."></textarea>
            </div>

            <div id="logBox" class="hidden border rounded-md p-4 bg-white shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase">Live Verification Log</h3>
                    <div id="loader" class="animate-spin text-green-600 text-xs"><i class="fa-solid fa-circle-notch"></i></div>
                </div>
                <div id="sg" class="space-y-1.5 max-h-32 overflow-y-auto pr-2"></div>
            </div>

            <div id="resultsUI" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="result-box bg-[#f0f9ff] border-blue-500">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-blue-800 uppercase">Live (Comma)</span>
                            <button onclick="copy('oc')" class="text-[10px] font-bold text-blue-600">COPY</button>
                        </div>
                        <textarea id="oc" readonly class="w-full bg-transparent border-none text-[11px] code-area resize-none" rows="2"></textarea>
                    </div>

                    <div class="result-box bg-[#fff0f6] border-pink-500">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-pink-800 uppercase">Live (Pipe)</span>
                            <button onclick="copy('op')" class="text-[10px] font-bold text-pink-600">COPY</button>
                        </div>
                        <textarea id="op" readonly class="w-full bg-transparent border-none text-[11px] code-area resize-none" rows="2"></textarea>
                    </div>
                </div>

                <div id="filterSection" class="result-box bg-[#fffcf0] border-amber-500 mt-4 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-amber-800 uppercase">Processed uBO Filter</span>
                        <button onclick="dl()" class="btn-git py-0.5 px-3">Download .txt</button>
                    </div>
                    <textarea id="of" readonly class="w-full bg-transparent border-none text-[10px] code-area resize-none" rows="12"></textarea>
                </div>
            </div>
        </div>
    </main>

    <script>
        let cache = new Map();

        async function handleFile(i) { if(i.files[0]) document.getElementById('ti').value = await i.files[0].text(); }
        function copy(id) { document.getElementById(id).select(); document.execCommand('copy'); }

        async function validate(d) {
            const domain = d.replace(/^https?:\/\//, '').split('/')[0].split(':')[0];
            if (domain.includes('*')) return 'skip';
            if (cache.has(domain)) return cache.get(domain);

            try {
                const dns = await fetch(`https://dns.google/resolve?name=${domain}&type=A`).then(r => r.json());
                if (dns.Status !== 0 || !dns.Answer) return 'dead';

                const trap = `verify-${Math.floor(Math.random()*999)}.${domain}`;
                const wild = await fetch(`https://dns.google/resolve?name=${trap}&type=A`).then(r => r.json());
                if (wild.Status === 0 && wild.Answer) return 'dead';

                const c = new AbortController();
                const t = setTimeout(() => c.abort(), 3500);
                try {
                    await fetch(`https://${domain}`, { mode: 'no-cors', signal: c.signal });
                    clearTimeout(t); cache.set(domain, 'live'); return 'live';
                } catch {
                    try {
                        await fetch(`http://${domain}`, { mode: 'no-cors', signal: c.signal });
                        clearTimeout(t); cache.set(domain, 'live'); return 'live';
                    } catch { return 'dead'; }
                }
            } catch { return 'dead'; }
        }

        async function runEngine() {
            let input = document.getElementById('ti').value.trim();
            if (!input) return;

            // Handle GitHub Raw Link
            if (input.startsWith('https://github.com/')) {
                input = input.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                document.getElementById('ti').value = "...Fetching from GitHub...";
                const res = await fetch(input);
                input = await res.text();
                document.getElementById('ti').value = input;
            }

            document.getElementById('runBtn').disabled = true;
            document.getElementById('logBox').classList.remove('hidden');
            document.getElementById('resultsUI').classList.remove('hidden');
            document.getElementById('sg').innerHTML = '';
            
            const lines = input.split('\n');
            const isUbo = input.includes('||') || input.includes('##') || input.includes('@@');
            let livePool = [], processedLines = [];

            for (let line of lines) {
                let domains = line.trim().startsWith('!') ? null : 
                              line.split(/##|\$|#@#/)[0].replace(/^\|\|/, '').replace(/^@@/, '').trim().split(',').map(d => d.trim());

                if (!domains || domains[0] === "") {
                    processedLines.push(line);
                    continue;
                }

                let results = [];
                for (let d of domains) {
                    const s = await validate(d);
                    const log = document.createElement('div');
                    log.className = "flex items-center gap-3 text-[11px] pb-1 border-b border-gray-50";
                    log.innerHTML = `<span class="badge ${s==='live'?'badge-live':'badge-dead'}">${s}</span> <span class="text-gray-600 truncate">${d}</span>`;
                    document.getElementById('sg').prepend(log);
                    
                    results.push(s);
                    if (s === 'live' || s === 'skip') livePool.push(d);
                }

                if (results.every(s => s === 'dead')) {
                    processedLines.push(`! dead\n! ${line}`);
                } else {
                    processedLines.push(line);
                }
            }

            const uniqueLive = [...new Set(livePool)];
            document.getElementById('oc').value = uniqueLive.join(',');
            document.getElementById('op').value = uniqueLive.join('|');
            
            const filterSec = document.getElementById('filterSection');
            if (isUbo) {
                filterSec.classList.remove('hidden');
                document.getElementById('of').value = processedLines.join('\n');
            } else {
                filterSec.classList.add('hidden');
            }

            document.getElementById('runBtn').disabled = false;
            document.getElementById('loader').classList.add('hidden');
        }

        function dl() {
            const blob = new Blob([document.getElementById('of').value], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `blaze_cleansed_filters.txt`;
            a.click();
        }
    </script>
</body>
</html>
