<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlazeFTL Editor v2.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary: #6200ee;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --text: #202124;
            --border: #dadce0;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        header {
            position: sticky; top: 0; z-index: 1000;
            background: white;
            height: 64px;
            display: flex; align-items: center;
            padding: 0 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            gap: 12px;
        }
        .header-section { display: flex; align-items: center; gap: 8px; }
        .search-area {
            background: var(--surface);
            border-radius: 8px;
            display: flex; align-items: center;
            padding: 2px 12px;
            flex-grow: 1;
            max-width: 700px;
            border: 1px solid transparent;
        }
        .search-area:focus-within { border-color: var(--primary); background: white; }
        .search-area input {
            border: none; background: transparent;
            outline: none; padding: 10px; font-size: 13px;
            width: 120px; flex-grow: 1;
        }
        .v-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
        .btn {
            cursor: pointer; border: none; background: transparent;
            display: flex; align-items: center; justify-content: center;
            padding: 8px; border-radius: 4px; color: #5f6368;
        }
        .btn:hover { background: rgba(0,0,0,0.05); }
        .btn.active { color: var(--primary); background: rgba(98,0,238,0.1); }
        .save-btn {
            background: var(--primary); color: white;
            padding: 10px 20px; border-radius: 4px;
            font-weight: 500; font-size: 13px;
            text-transform: uppercase; border: none; cursor: pointer;
        }
        #status { font-size: 11px; color: #70757a; min-width: 60px; }
        
        #editor { flex-grow: 1; overflow: hidden; }
        .cm-editor { height: 100%; font-size: 13px; }

        /* uBlock Syntax Highlighting */
        .cm-filter-comment { color: #919191; font-style: italic; }
        .cm-filter-keyword { color: #d73a49; font-weight: bold; }
        .cm-filter-selector { color: #005cc5; }
        .cm-filter-action { color: #22863a; }
        .cm-filter-regex { color: #e36209; }
    </style>
</head>
<body>

<header>
    <div class="header-section">
        <button class="btn" id="loadBtn" title="Refetch Repo"><span class="material-icons">refresh</span></button>
        <span id="status">Ready</span>
    </div>

    <div class="search-area">
        <input type="text" id="findInput" placeholder="Find">
        <input type="text" id="replaceInput" placeholder="Replace">
        <div class="v-divider"></div>
        <input type="number" id="gotoLine" placeholder="Line" style="width: 50px; flex-grow: 0;">
        <button class="btn" id="regexToggle" title="Regex Mode"><span class="material-icons" style="font-size: 18px;">reorder</span></button>
    </div>

    <div class="header-section">
        <input type="password" id="ghToken" placeholder="Token" style="width: 100px; padding: 8px; border: 1px solid var(--border); border-radius: 4px;">
        <button class="save-btn" id="saveBtn">Save</button>
    </div>
</header>

<div id="editor"></div>

<script type="module">
    import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
    import { EditorState } from "https://esm.sh/@codemirror/state@6.0.0";
    import { StreamLanguage } from "https://esm.sh/@codemirror/language@6.0.0";
    import { search, findNext, replaceNext, gotoLine } from "https://esm.sh/@codemirror/search@6.0.0";

    const uBlockMode = {
        token(stream) {
            if (stream.match(/^!.*/)) return "filter-comment";
            if (stream.match(/^@@/) || stream.match(/^\|\|/)) return "filter-keyword";
            if (stream.match(/^##/) || stream.match(/^#@#/) || stream.match(/^#\?#/) || stream.match(/^#\$#/)) return "filter-selector";
            if (stream.match(/\$[a-z1-9,=-]+$/)) return "filter-action";
            if (stream.match(/\/.+\//)) return "filter-regex";
            stream.next();
            return null;
        }
    };

    const config = {
        owner: 'BlazeFTL',
        repo: 'My-Filters',
        path: 'My-Filters_Static_Sites.txt',
        branch: 'master'
    };

    let editor;
    let fileSha = null;
    let isRegex = false;

    function setStatus(msg, error = false) {
        const s = document.getElementById('status');
        s.textContent = msg;
        s.style.color = error ? '#d32f2f' : '#70757a';
    }

    async function fetchFile() {
        setStatus("Loading...");
        const token = document.getElementById('ghToken').value;
        const headers = token ? { 'Authorization': `token ${token}` } : {};

        try {
            const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}?ref=${config.branch}`;
            const res = await fetch(url, { headers });
            
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();
            fileSha = data.sha;
            
            // Safer UTF-8 Decoding
            const binary = atob(data.content.replace(/\s/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const content = new TextDecoder().decode(bytes);

            if (!editor) {
                editor = new EditorView({
                    state: EditorState.create({
                        doc: content,
                        extensions: [
                            basicSetup,
                            search({ top: true }),
                            StreamLanguage.define(uBlockMode),
                            EditorView.lineWrapping
                        ]
                    }),
                    parent: document.getElementById("editor")
                });
            } else {
                editor.dispatch({ changes: { from: 0, to: editor.state.doc.length, insert: content } });
            }
            setStatus("Loaded");
        } catch (e) {
            setStatus("Error", true);
            console.error(e);
        }
    }

    async function saveFile() {
        const token = document.getElementById('ghToken').value;
        if (!token) return alert("GitHub Token Required");

        setStatus("Saving...");
        try {
            const text = editor.state.doc.toString();
            const bytes = new TextEncoder().encode(text);
            const base64 = btoa(String.fromCharCode(...bytes));

            const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Update filters (Editor v2.3)",
                    content: base64,
                    sha: fileSha,
                    branch: config.branch
                })
            });

            if (res.ok) {
                const data = await res.json();
                fileSha = data.content.sha;
                setStatus("Saved!");
            } else {
                const err = await res.json();
                throw new Error(err.message);
            }
        } catch (e) {
            setStatus("Save Error", true);
            alert(e.message);
        }
    }

    // Controls
    document.getElementById('loadBtn').onclick = fetchFile;
    document.getElementById('saveBtn').onclick = saveFile;
    document.getElementById('regexToggle').onclick = (e) => {
        isRegex = !isRegex;
        e.currentTarget.classList.toggle('active', isRegex);
    };

    document.getElementById('findInput').onkeydown = (e) => { if(e.key === 'Enter') findNext(editor); };
    document.getElementById('replaceInput').onkeydown = (e) => { if(e.key === 'Enter') replaceNext(editor); };
    document.getElementById('gotoLine').onkeydown = (e) => {
        if(e.key === 'Enter') {
            const line = parseInt(e.target.value);
            if(line > 0) {
                const pos = editor.state.doc.line(Math.min(line, editor.state.doc.lines)).from;
                editor.dispatch({ selection: { anchor: pos }, scrollIntoView: true });
                editor.focus();
            }
        }
    };

    fetchFile();
</script>
</body>
</html>
