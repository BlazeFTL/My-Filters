<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uAssets Filter Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e28;
    --surface3: #222635;
    --border: #2a2f3f;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --accent3: #f59e0b;
    --danger: #f87171;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
    --highlight: rgba(74, 222, 128, 0.12);
    --highlight-border: rgba(74, 222, 128, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOP BAR */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #topbar .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  #topbar .logo span { color: var(--text2); font-weight: 400; }
  #pat-input {
    flex: 1;
    max-width: 320px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  #pat-input:focus { border-color: var(--accent); }
  #pat-input::placeholder { color: var(--text3); }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-green { background: var(--accent); color: #000; }
  .btn-green:hover { background: #86efac; }
  .btn-green:disabled { background: var(--surface3); color: var(--text3); cursor: not-allowed; }
  .btn-blue { background: var(--accent2); color: #000; }
  .btn-blue:hover { background: #67e8f9; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--danger); color: #000; }
  .btn-danger:hover { background: #fca5a5; }

  #status-bar {
    padding: 4px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status-bar .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
    flex-shrink: 0;
  }
  #status-bar .dot.green { background: var(--accent); }
  #status-bar .dot.yellow { background: var(--accent3); }
  #status-bar .dot.red { background: var(--danger); }

  /* MAIN LAYOUT */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text3);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #file-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #file-list::-webkit-scrollbar { width: 4px; }
  #file-list::-webkit-scrollbar-track { background: transparent; }
  #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .file-item {
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }
  .file-item:hover { background: var(--surface2); color: var(--text); }
  .file-item.active {
    background: var(--highlight);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .file-item .icon { color: var(--text3); flex-shrink: 0; font-size: 10px; }
  .file-item.active .icon { color: var(--accent); }
  .file-item .modified-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent3);
    flex-shrink: 0;
    margin-left: auto;
  }

  /* CENTER: EDITOR + SEARCH */
  #center {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* SEARCH BAR */
  #search-area {
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #search-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent2); }
  #search-input::placeholder { color: var(--text3); }
  .search-mode-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .search-mode-btn {
    padding: 5px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--text3);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .search-mode-btn.active {
    background: var(--accent2);
    color: #000;
    font-weight: 600;
  }

  /* EDITOR AREA */
  #editor-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #editor-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text3);
  }
  #editor-placeholder .big { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text2); font-weight: 700; }
  #editor-placeholder .small { font-size: 12px; }

  #editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #editor-tab {
    padding: 8px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #editor-tab .filename { color: var(--accent); font-weight: 500; }
  #editor-tab .actions { display: flex; gap: 8px; align-items: center; }

  #editor-wrap {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  #line-numbers {
    width: 48px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow: hidden;
    text-align: right;
    padding: 12px 8px 12px 0;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text3);
    user-select: none;
    flex-shrink: 0;
  }
  #editor {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: none;
    overflow-y: scroll;
    white-space: pre;
    overflow-x: auto;
    tab-size: 2;
  }
  #editor::-webkit-scrollbar { width: 6px; height: 6px; }
  #editor::-webkit-scrollbar-track { background: transparent; }
  #editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* SEARCH RESULTS PANEL */
  #search-results {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    display: none;
  }
  #search-results::-webkit-scrollbar { width: 4px; }
  #search-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .search-file-group { margin-bottom: 8px; }
  .search-file-header {
    padding: 6px 16px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .search-file-header .count {
    background: var(--accent2);
    color: #000;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 20px;
    font-weight: 600;
  }
  .search-result-item {
    padding: 5px 16px 5px 24px;
    font-size: 11px;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .search-result-item:hover { background: var(--surface2); color: var(--text); }
  .search-result-item .line-num {
    color: var(--text3);
    font-size: 10px;
    flex-shrink: 0;
    min-width: 32px;
    text-align: right;
  }
  .search-result-item .line-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .search-result-item .line-text mark {
    background: rgba(250, 204, 21, 0.35);
    color: #fde047;
    border-radius: 2px;
  }
  .no-results {
    padding: 24px 16px;
    text-align: center;
    color: var(--text3);
    font-size: 12px;
  }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--text3);
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 12px;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.25s;
    z-index: 100;
    max-width: 300px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { border-color: var(--accent); }
  #toast.error { border-color: var(--danger); }

  /* RESIZE HANDLE */
  #resize-handle {
    width: 4px;
    background: var(--border);
    cursor: col-resize;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #resize-handle:hover { background: var(--accent); }

  #search-count {
    font-size: 11px;
    color: var(--text3);
    padding: 4px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    display: none;
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">uAssets <span>/ filter editor</span></div>
  <input type="password" id="pat-input" placeholder="GitHub PAT (ghp_...)" autocomplete="off" />
  <button class="btn btn-green" id="load-btn" onclick="loadFiles()">Load Files</button>
  <div style="flex:1"></div>
  <span id="file-count" style="font-size:11px;color:var(--text3)"></span>
</div>
<div id="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Enter your GitHub PAT and click Load Files</span>
</div>

<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Files</span>
      <span id="sidebar-count" style="font-size:10px;color:var(--text3)"></span>
    </div>
    <div id="file-list"></div>
  </div>

  <div id="resize-handle" id="rh"></div>

  <!-- CENTER -->
  <div id="center">
    <div id="search-area">
      <input type="text" id="search-input" placeholder="Search..." oninput="onSearchInput()" />
      <div class="search-mode-toggle">
        <button class="search-mode-btn active" id="mode-all" onclick="setSearchMode('all')">All Files</button>
        <button class="search-mode-btn" id="mode-current" onclick="setSearchMode('current')">Current File</button>
      </div>
      <button class="btn btn-outline" onclick="clearSearch()" style="padding:5px 10px;font-size:11px">✕ Clear</button>
    </div>

    <div id="search-count"></div>

    <div id="editor-area">
      <div id="editor-placeholder">
        <div class="big">No file open</div>
        <div class="small">Select a file from the sidebar to start editing</div>
      </div>
      <div id="editor-container" style="display:none">
        <div id="editor-tab">
          <span><span style="color:var(--text3)">filters /</span> <span class="filename" id="editor-filename">—</span></span>
          <div class="actions">
            <span id="editor-lines" style="font-size:11px;color:var(--text3)"></span>
            <button class="btn btn-green" id="save-btn" onclick="saveFile()" disabled>↑ Commit</button>
          </div>
        </div>
        <div id="editor-wrap">
          <div id="line-numbers"></div>
          <textarea id="editor" spellcheck="false" oninput="onEditorInput()" onscroll="syncScroll()"></textarea>
        </div>
      </div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const OWNER = 'uBlockOrigin';
const REPO = 'uAssets';
const BRANCH = 'master';
const PATH = 'filters';

let files = {}; // filename -> {sha, content, modified}
let currentFile = null;
let searchMode = 'all';
let searchTimeout = null;
let fileOrder = [];

function getPAT() {
  return document.getElementById('pat-input').value.trim();
}

function setStatus(msg, type = '') {
  document.getElementById('status-text').textContent = msg;
  const dot = document.getElementById('status-dot');
  dot.className = 'dot' + (type ? ' ' + type : '');
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3000);
}

async function ghFetch(url, opts = {}) {
  const pat = getPAT();
  const headers = {
    'Authorization': `Bearer ${pat}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    ...opts.headers
  };
  const res = await fetch(url, { ...opts, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res;
}

async function loadFiles() {
  const pat = getPAT();
  if (!pat) { toast('Please enter your GitHub PAT first', 'error'); return; }

  setStatus('Loading file list...', 'yellow');
  document.getElementById('load-btn').disabled = true;
  document.getElementById('file-list').innerHTML = '<div class="loading"><div class="spinner"></div>Fetching files...</div>';

  try {
    const res = await ghFetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`);
    const items = await res.json();
    const txtFiles = items.filter(f => f.type === 'file' && f.name.endsWith('.txt'));

    files = {};
    fileOrder = txtFiles.map(f => f.name);
    txtFiles.forEach(f => { files[f.name] = { sha: f.sha, content: null, modified: false }; });

    renderFileList();
    setStatus(`Loaded ${txtFiles.length} .txt files — click a file to open it`, 'green');
    document.getElementById('file-count').textContent = `${txtFiles.length} files`;
    document.getElementById('sidebar-count').textContent = txtFiles.length;
    toast(`${txtFiles.length} files loaded`);
  } catch (e) {
    setStatus('Error: ' + e.message, 'red');
    toast('Failed: ' + e.message, 'error');
    document.getElementById('file-list').innerHTML = '<div class="loading" style="color:var(--danger)">Error loading files</div>';
  }
  document.getElementById('load-btn').disabled = false;
}

function renderFileList() {
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  fileOrder.forEach(name => {
    const f = files[name];
    const div = document.createElement('div');
    div.className = 'file-item' + (name === currentFile ? ' active' : '');
    div.dataset.name = name;
    div.innerHTML = `<span class="icon">▸</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>${f.modified ? '<span class="modified-dot"></span>' : ''}`;
    div.onclick = () => openFile(name);
    list.appendChild(div);
  });
}

async function openFile(name) {
  if (files[name].content === null) {
    setStatus(`Loading ${name}...`, 'yellow');
    try {
      const res = await ghFetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}/${name}?ref=${BRANCH}`);
      const data = await res.json();
      files[name].content = atob(data.content.replace(/\n/g, ''));
      files[name].sha = data.sha;
    } catch (e) {
      toast('Failed to load ' + name + ': ' + e.message, 'error');
      setStatus('Error loading file', 'red');
      return;
    }
  }

  currentFile = name;
  renderFileList();

  // Show editor
  document.getElementById('editor-placeholder').style.display = 'none';
  document.getElementById('editor-container').style.display = 'flex';
  document.getElementById('search-results').style.display = 'none';

  document.getElementById('editor-filename').textContent = name;
  const editor = document.getElementById('editor');
  editor.value = files[name].content;
  updateLineNumbers();
  updateEditorStats();
  document.getElementById('save-btn').disabled = !files[name].modified;
  setStatus(`Editing ${name}`, 'green');

  // Re-run search if in current mode
  if (searchMode === 'current' && document.getElementById('search-input').value.trim()) {
    onSearchInput();
  }
}

function onEditorInput() {
  if (!currentFile) return;
  files[currentFile].content = document.getElementById('editor').value;
  files[currentFile].modified = true;
  document.getElementById('save-btn').disabled = false;
  updateLineNumbers();
  updateEditorStats();
  renderFileList();
  if (searchMode === 'current' && document.getElementById('search-input').value.trim()) {
    onSearchInput();
  }
}

function updateLineNumbers() {
  const editor = document.getElementById('editor');
  const lines = editor.value.split('\n').length;
  const ln = document.getElementById('line-numbers');
  let html = '';
  for (let i = 1; i <= lines; i++) html += i + '\n';
  ln.textContent = html;
}

function syncScroll() {
  const editor = document.getElementById('editor');
  document.getElementById('line-numbers').scrollTop = editor.scrollTop;
}

function updateEditorStats() {
  const val = document.getElementById('editor').value;
  const lines = val.split('\n').length;
  const bytes = new Blob([val]).size;
  document.getElementById('editor-lines').textContent = `${lines.toLocaleString()} lines · ${formatBytes(bytes)}`;
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

async function saveFile() {
  if (!currentFile) return;
  const pat = getPAT();
  if (!pat) { toast('PAT required to save', 'error'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '↑ Saving...';
  setStatus('Committing changes...', 'yellow');

  try {
    const content = btoa(unescape(encodeURIComponent(files[currentFile].content)));
    const body = {
      message: `Update ${currentFile} via uAssets Editor`,
      content,
      sha: files[currentFile].sha,
      branch: BRANCH
    };
    const res = await ghFetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}/${currentFile}`,
      { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } }
    );
    const data = await res.json();
    files[currentFile].sha = data.content.sha;
    files[currentFile].modified = false;
    renderFileList();
    setStatus(`Saved ${currentFile}`, 'green');
    toast(`✓ ${currentFile} committed`);
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
    setStatus('Save failed: ' + e.message, 'red');
  }
  btn.textContent = '↑ Commit';
  btn.disabled = files[currentFile] ? !files[currentFile].modified : true;
}

function setSearchMode(mode) {
  searchMode = mode;
  document.getElementById('mode-all').className = 'search-mode-btn' + (mode === 'all' ? ' active' : '');
  document.getElementById('mode-current').className = 'search-mode-btn' + (mode === 'current' ? ' active' : '');
  const q = document.getElementById('search-input').value.trim();
  if (q) onSearchInput(); else clearSearch();
}

function onSearchInput() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 250);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) { clearSearch(); return; }

  if (searchMode === 'current') {
    searchCurrentFile(q);
  } else {
    await searchAllFiles(q);
  }
}

function searchCurrentFile(q) {
  if (!currentFile || files[currentFile].content === null) {
    showSearchResults('<div class="no-results">No file open for searching</div>', 0);
    return;
  }
  const results = getMatches(currentFile, files[currentFile].content, q);
  renderSearchResults({ [currentFile]: results }, q);
}

async function searchAllFiles(q) {
  const resultsEl = document.getElementById('search-results');
  resultsEl.style.display = 'block';
  document.getElementById('editor-container').style.display = 'none';
  resultsEl.innerHTML = '<div class="loading"><div class="spinner"></div>Searching all files...</div>';

  // Load unloaded files first
  const unloaded = fileOrder.filter(n => files[n].content === null);
  if (unloaded.length > 0) {
    setStatus(`Loading ${unloaded.length} unread files...`, 'yellow');
    for (const name of unloaded) {
      try {
        const res = await ghFetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}/${name}?ref=${BRANCH}`);
        const data = await res.json();
        files[name].content = atob(data.content.replace(/\n/g, ''));
        files[name].sha = data.sha;
      } catch (e) { files[name].content = ''; }
    }
    setStatus('Search complete', 'green');
  }

  const allResults = {};
  for (const name of fileOrder) {
    const matches = getMatches(name, files[name].content || '', q);
    if (matches.length > 0) allResults[name] = matches;
  }
  renderSearchResults(allResults, q);
}

function getMatches(filename, content, q) {
  const lower = q.toLowerCase();
  const lines = content.split('\n');
  const results = [];
  lines.forEach((line, i) => {
    if (line.toLowerCase().includes(lower)) {
      results.push({ line: i + 1, text: line });
    }
  });
  return results;
}

function renderSearchResults(allResults, q) {
  const total = Object.values(allResults).reduce((s, r) => s + r.length, 0);
  const fileCount = Object.keys(allResults).length;

  const countEl = document.getElementById('search-count');
  if (total > 0) {
    countEl.textContent = `${total} match${total !== 1 ? 'es' : ''} in ${fileCount} file${fileCount !== 1 ? 's' : ''}`;
    countEl.style.display = 'block';
  } else {
    countEl.style.display = 'none';
  }

  const resultsEl = document.getElementById('search-results');
  resultsEl.style.display = 'block';
  document.getElementById('editor-container').style.display = 'none';

  if (total === 0) {
    resultsEl.innerHTML = `<div class="no-results">No matches for "<strong style="color:var(--text2)">${escHtml(q)}</strong>"</div>`;
    return;
  }

  let html = '';
  for (const [name, matches] of Object.entries(allResults)) {
    html += `<div class="search-file-group">
      <div class="search-file-header">
        <span>${escHtml(name)}</span>
        <span class="count">${matches.length}</span>
      </div>`;
    matches.slice(0, 200).forEach(m => {
      const highlighted = escHtml(m.text).replace(
        new RegExp(escRegex(escHtml(q)), 'gi'),
        match => `<mark>${match}</mark>`
      );
      html += `<div class="search-result-item" data-file="${escHtml(name)}" data-line="${m.line}">
        <span class="line-num">${m.line}</span>
        <span class="line-text">${highlighted}</span>
      </div>`;
    });
    if (matches.length > 200) {
      html += `<div class="search-result-item" style="color:var(--text3);cursor:default">… and ${matches.length - 200} more</div>`;
    }
    html += '</div>';
  }
  resultsEl.innerHTML = html;

  // Click to jump
  resultsEl.querySelectorAll('.search-result-item[data-file]').forEach(el => {
    el.addEventListener('click', () => {
      const fname = el.dataset.file;
      const line = parseInt(el.dataset.line);
      jumpToLine(fname, line);
    });
  });
}

async function jumpToLine(fname, line) {
  await openFile(fname);
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('editor-container').style.display = 'flex';

  // Jump to line in textarea
  const editor = document.getElementById('editor');
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  editor.focus();
  editor.setSelectionRange(pos, pos + lines[line - 1].length);

  // Scroll line into view
  const lineHeight = 19.2; // 12px * 1.6
  editor.scrollTop = Math.max(0, (line - 10) * lineHeight);
  syncScroll();
}

function showSearchResults(html, count) {
  const resultsEl = document.getElementById('search-results');
  resultsEl.style.display = 'block';
  document.getElementById('editor-container').style.display = 'none';
  resultsEl.innerHTML = html;
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-count').style.display = 'none';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-results').innerHTML = '';
  if (currentFile) {
    document.getElementById('editor-container').style.display = 'flex';
  } else {
    document.getElementById('editor-placeholder').style.display = 'flex';
  }
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Resize sidebar
(function() {
  const handle = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  let dragging = false, startX, startW;
  handle.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = sidebar.offsetWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(150, Math.min(400, startW + e.clientX - startX));
    sidebar.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (currentFile && files[currentFile]?.modified) saveFile();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
});
</script>
