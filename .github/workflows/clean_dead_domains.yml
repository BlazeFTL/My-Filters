name: Clean Dead Domains

on:
  workflow_dispatch:
    inputs:
      filter_file:
        description: 'File path or URL to filter list'
        required: true
        default: 'My-Filters_Static_Sites.txt'

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aiohttp
        run: pip install aiohttp

      - name: Resolve input file
        run: |
          INPUT="${{ github.event.inputs.filter_file || 'My-Filters_Static_Sites.txt' }}"
          # If it's a URL, download it first
          if echo "$INPUT" | grep -qE '^https?://'; then
            FILENAME=$(basename "$INPUT")
            curl -fsSL "$INPUT" -o "$FILENAME"
            echo "FILTER_FILE=$FILENAME" >> $GITHUB_ENV
          else
            echo "FILTER_FILE=$INPUT" >> $GITHUB_ENV
          fi

      - name: Run dead domain cleaner
        run: python tools/check_dead_domains.py "$FILTER_FILE"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: dead domain cleaned $(date -u +%Y-%m-%d)"

      - name: Push
        run: git push
