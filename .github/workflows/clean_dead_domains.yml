name: Clean Dead Domains

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aiohttp
        run: pip install aiohttp

      - name: Run dead domain cleaner
        run: python tools/check_dead_domains.py deadtest.txt

      - name: Commit result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*_Dead_Domain_Cleaned.txt"
          git diff --staged --quiet || git commit -m "chore: dead domain cleaned $(date -u +%Y-%m-%d)"
          g
          it push
